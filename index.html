<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer's Box</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='108 100 260 266'%3E%3Cstyle%3Epath%7Bfill:%2324292f%7D@media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23fff%7D%7D%3C/style%3E%3Cpath d='M132 140 264 112 355 177 203 212z'/%3E%3Cpath d='M118 147 196 214v44L118 191z'/%3E%3Cpath d='M206 217 357 181v41L206 258z'/%3E%3Cpath d='M130 213 197 271v86L130 299z'/%3E%3Cpath d='M207 271 342 238v80L207 357z'/%3E%3C/svg%3E">
<style>
/* Layout idea: a code-hosting interface for prose — dark global header, repository header with underline tabs, boxed lists, diff tables. */
:root {
  --fg: #1f2328; --muted: #59636e; --canvas: #ffffff; --subtle: #f6f8fa; --inset: #f6f8fa;
  --border: #d1d9e0; --border-muted: #d1d9e0b3;
  --accent: #0969da; --accent-subtle: #ddf4ff;
  --success: #1f883d; --success-hover: #1c8139; --success-fg: #1a7f37;
  --danger: #d1242f; --attention: #9a6700; --attention-subtle: #fff8c5; --attention-border: rgba(212,167,44,.4);
  --done: #8250df;
  --header-bg: #1f2328; --header-fg: #ffffff; --header-muted: #9198a1;
  --btn-bg: #f6f8fa; --btn-hover: #eff2f5; --btn-border: rgba(31,35,40,.15);
  --nav-underline: #fd8c73; --counter-bg: rgba(129,139,152,.12);
  --add-line: #e6ffec; --add-num: #ccffd8; --add-word: #abf2bc;
  --del-line: #ffebe9; --del-num: #ffd7d5; --del-word: rgba(255,129,130,.4);
  --hunk-bg: #ddf4ff; --hunk-num: #b6e3ff;
  --overlay-shadow: 0 1px 1px rgba(31,35,40,.06), 0 8px 24px rgba(66,74,83,.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fg: #f0f6fc; --muted: #9198a1; --canvas: #0d1117; --subtle: #151b23; --inset: #010409;
    --border: #3d444d; --border-muted: #3d444db3;
    --accent: #4493f8; --accent-subtle: rgba(56,139,253,.1);
    --success: #238636; --success-hover: #29903b; --success-fg: #3fb950;
    --danger: #f85149; --attention: #d29922; --attention-subtle: rgba(187,128,9,.15); --attention-border: rgba(187,128,9,.4);
    --done: #ab7df8;
    --header-bg: #010409; --header-fg: #f0f6fc; --header-muted: #9198a1;
    --btn-bg: #212830; --btn-hover: #262c36; --btn-border: #3d444d;
    --counter-bg: rgba(101,108,118,.2);
    --add-line: rgba(46,160,67,.15); --add-num: rgba(63,185,80,.3); --add-word: rgba(46,160,67,.4);
    --del-line: rgba(248,81,73,.1); --del-num: rgba(248,81,73,.3); --del-word: rgba(248,81,73,.4);
    --hunk-bg: rgba(56,139,253,.1); --hunk-num: rgba(56,139,253,.25);
    --overlay-shadow: 0 0 0 1px #3d444d, 0 8px 24px rgba(1,4,9,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fg: #f0f6fc; --muted: #9198a1; --canvas: #0d1117; --subtle: #151b23; --inset: #010409;
  --border: #3d444d; --border-muted: #3d444db3;
  --accent: #4493f8; --accent-subtle: rgba(56,139,253,.1);
  --success: #238636; --success-hover: #29903b; --success-fg: #3fb950;
  --danger: #f85149; --attention: #d29922; --attention-subtle: rgba(187,128,9,.15); --attention-border: rgba(187,128,9,.4);
  --done: #ab7df8;
  --header-bg: #010409; --header-fg: #f0f6fc; --header-muted: #9198a1;
  --btn-bg: #212830; --btn-hover: #262c36; --btn-border: #3d444d;
  --counter-bg: rgba(101,108,118,.2);
  --add-line: rgba(46,160,67,.15); --add-num: rgba(63,185,80,.3); --add-word: rgba(46,160,67,.4);
  --del-line: rgba(248,81,73,.1); --del-num: rgba(248,81,73,.3); --del-word: rgba(248,81,73,.4);
  --hunk-bg: rgba(56,139,253,.1); --hunk-num: rgba(56,139,253,.25);
  --overlay-shadow: 0 0 0 1px #3d444d, 0 8px 24px rgba(1,4,9,.75);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--canvas); color: var(--fg); font: 14px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a, .link { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
a:hover, .link:hover { text-decoration: underline; }
.link-muted { color: var(--muted); }
.link-muted:hover { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
svg.oc { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; vertical-align: text-bottom; flex: none; }
svg.oc.solid { fill: currentColor; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Global header */
.gh { background: var(--header-bg); color: var(--header-fg); padding: 12px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gh .mark { display: flex; align-items: center; gap: 8px; color: var(--header-fg); font-weight: 600; font-size: 15px; }
.gh .mark svg { width: 28px; height: 28px; }
.gh .mark svg.logo { color: var(--logo, var(--header-fg)); width: 26px; height: 26px; }
.gh .crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--header-muted); }
.gh .crumbs strong { color: var(--header-fg); font-weight: 600; }
.gh .grow { flex: 1; }
.gh select { background: transparent; color: var(--header-fg); border: 1px solid #3d444d; border-radius: 6px; padding: 4px 8px; max-width: 280px; }
.gh select option { color: #1f2328; }
.gh .hbtn { background: transparent; color: var(--header-fg); border: 1px solid #3d444d; border-radius: 6px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; }
.gh .hbtn:hover { border-color: #9198a1; }

/* Repo header */
.repohead { background: var(--subtle); border-bottom: 1px solid var(--border); padding: 16px 24px 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .repohead { background: var(--inset); } }
:root[data-theme="dark"] .repohead { background: var(--inset); }
.repotitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 20px; margin-bottom: 14px; }
.repotitle .owner { color: var(--accent); font-weight: 400; }
.repotitle strong { color: var(--accent); font-weight: 600; }
.repotitle .grow { flex: 1; }
.unav { display: flex; gap: 8px; overflow-x: auto; }
.unav button { background: none; border: 0; padding: 0 8px; height: 48px; display: inline-flex; align-items: center; gap: 8px; color: var(--fg); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; border-radius: 0; }
.unav button > span.in { padding: 4px 8px; border-radius: 6px; display: inline-flex; gap: 8px; align-items: center; }
.unav button:hover > span.in { background: var(--btn-hover); }
.unav button[aria-current="page"] { border-bottom-color: var(--nav-underline); font-weight: 600; }
.unav svg.oc { color: var(--muted); }

/* Primitives */
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; cursor: pointer; border-radius: 6px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--fg); }
.btn:hover { background: var(--btn-hover); }
.btn svg.oc { color: var(--muted); }
.btn-primary { background: var(--success); color: #fff; border-color: rgba(31,35,40,.15); }
.btn-primary:hover { background: var(--success-hover); }
.btn-primary svg.oc { color: #fff; }
.btn-primary:disabled { opacity: .55; cursor: default; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-octicon { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 6px; cursor: pointer; display: inline-flex; }
.btn-octicon:hover { color: var(--accent); background: var(--btn-hover); }
.counter { display: inline-block; min-width: 20px; padding: 0 6px; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; border-radius: 2em; background: var(--counter-bg); color: var(--fg); }
.btn-primary .counter { background: rgba(255,255,255,.2); color: #fff; }
.label { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; border: 1px solid var(--border); border-radius: 2em; color: var(--muted); }
.label-accent { color: var(--accent); border-color: var(--accent); }
.label-attention { color: var(--attention); border-color: var(--attention); }
.label-success { color: var(--success-fg); border-color: var(--success-fg); }
.label-danger { color: var(--danger); border-color: var(--danger); }
.label-done { color: var(--done); border-color: var(--done); }
.branch-name { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--accent-subtle); color: var(--accent); white-space: nowrap; }
.select-wrap { position: relative; display: inline-flex; align-items: center; }
.select-wrap svg.oc { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
select.btn { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
.select-wrap select.btn { padding-left: 32px; }
input[type="text"], textarea.form, select.form { width: 100%; padding: 5px 12px; min-height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--canvas); }
input[type="text"]:focus, textarea.form:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
.Box { border: 1px solid var(--border); border-radius: 6px; background: var(--canvas); }
.Box-header { background: var(--subtle); border-bottom: 1px solid var(--border); padding: 12px 16px; border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.Box-row { padding: 8px 16px; border-top: 1px solid var(--border-muted); display: flex; align-items: center; gap: 12px; }
.Box-row:first-child { border-top: 0; }
.Box-header + .Box-row { border-top: 0; }
.Box-row:hover { background: var(--subtle); }
.Box-body { padding: 16px; }
.flash { padding: 12px 16px; border: 1px solid var(--attention-border); background: var(--attention-subtle); border-radius: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.flash svg.oc { color: var(--attention); }
.flash.info { border-color: rgba(84,174,255,.4); background: var(--accent-subtle); }
.flash.info svg.oc { color: var(--accent); }
.flash .grow { flex: 1; }
.subhead { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); flex-wrap: wrap; }
.subhead h2 { font-size: 24px; font-weight: 400; margin: 0; flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; }
.blankslate { text-align: center; padding: 40px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.blankslate h3 { font-size: 20px; margin: 0; font-weight: 600; }
.blankslate svg.oc { width: 24px; height: 24px; color: var(--muted); }

/* Files view */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
@media (max-width: 1011px) { .layout { grid-template-columns: 1fr; } }
.filebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filebar .meta-link { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 14px; padding: 0 8px; }
.filebar .meta-link strong { color: var(--fg); }
.filebar .meta-link:hover { color: var(--accent); text-decoration: none; }
.latest { display: flex; gap: 10px; align-items: center; min-width: 0; flex-wrap: wrap; font-size: 14px; }
.avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--done); color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ftable { width: 100%; border-collapse: collapse; }
.ftable td { padding: 8px 16px; border-top: 1px solid var(--border-muted); font-size: 14px; }
.ftable tr:first-child td { border-top: 0; }
.ftable tr:hover td { background: var(--subtle); }
.ftable td.ic { width: 36px; padding-right: 0; color: var(--muted); }
.ftable td.ic svg.folder { color: #54aeff; }
.ftable td.nm { width: 34%; }
.ftable td.nm button { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.ftable td.nm button:hover { color: var(--accent); }
.ftable td.msg { color: var(--muted); max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ftable td.msg button { color: var(--muted); }
.ftable td.msg button:hover { color: var(--accent); }
.ftable td.when { color: var(--muted); text-align: right; white-space: nowrap; width: 120px; }
.ftable tr.del td.nm button { text-decoration: line-through; color: var(--muted); }
.about h2 { font-size: 16px; margin: 0 0 12px; }
.about p { margin: 0 0 14px; }
.about .stat { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 6px 0; }
.about .stat strong { color: var(--fg); }
.about hr { border: 0; border-top: 1px solid var(--border-muted); margin: 16px 0; }
.langbar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; margin: 8px 0 10px; gap: 2px; }
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
.langs li { display: inline-flex; align-items: center; gap: 6px; }
.langs .sw { width: 8px; height: 8px; border-radius: 50%; }
.breadcrumb { font-size: 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.breadcrumb strong { font-weight: 600; }

/* Blob / editor */
.blob-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--btn-border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--btn-bg); padding: 0 12px; height: 28px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--btn-border); }
.seg button[aria-pressed="true"] { background: var(--canvas); box-shadow: inset 0 0 0 1px var(--border); font-weight: 600; }
.editor-area { width: 100%; min-height: 520px; border: 0; resize: vertical; padding: 16px; font: 13.5px/1.7 var(--mono); background: var(--canvas); border-radius: 0 0 6px 6px; tab-size: 2; display: block; }
.editor-area:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.code-view { width: 100%; border-collapse: collapse; font: 12.5px/20px var(--mono); }
.code-view td { padding: 0 10px; vertical-align: top; }
.code-view td.n { width: 1%; min-width: 50px; text-align: right; color: var(--muted); user-select: none; }
.code-view td.t { white-space: pre-wrap; word-break: break-word; }

/* History */
.tl-group { position: relative; padding-left: 28px; margin-bottom: 16px; }
.tl-group::before { content: ""; position: absolute; left: 7px; top: 0; bottom: -16px; width: 2px; background: var(--border-muted); }
.tl-group:last-child::before { bottom: 0; }
.tl-date { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin: 0 0 8px -28px; position: relative; }
.tl-date .dot { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; background: var(--canvas); color: var(--muted); position: relative; z-index: 1; }
.vrow { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--border-muted); flex-wrap: wrap; }
.vrow:first-child { border-top: 0; }
.vrow:hover { background: var(--subtle); }
.vmain { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
.vmsg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vmsg .link { color: var(--fg); font-weight: 600; font-size: 15px; text-align: left; }
.vmsg .link:hover { color: var(--accent); }
.vmeta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.vmeta strong { color: var(--fg); font-weight: 600; }
.vacts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sha { font-family: var(--mono); font-size: 12px; }
.add { color: var(--success-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.del { color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }
.diffstat { display: inline-flex; gap: 1px; vertical-align: middle; margin-left: 4px; }
.diffstat i { width: 8px; height: 8px; background: var(--border); display: inline-block; }
.diffstat i.a { background: var(--success-fg); }
.diffstat i.d { background: var(--danger); }

/* Version / compare */
.vhead { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
.vhead .title { padding: 16px; font-size: 20px; font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vhead .foot { padding: 10px 16px; background: var(--subtle); border-top: 1px solid var(--border); border-radius: 0 0 6px 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.toc { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; gap: 12px; flex-wrap: wrap; }
.range { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; }
.range select { max-width: 360px; }
.range .arrow { color: var(--muted); }
.fdiff { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
.fdiff-head { position: sticky; top: 0; z-index: 2; background: var(--subtle); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; padding: 6px 10px 6px 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.fdiff-head .fn { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--fg); }
.fdiff.closed .fdiff-head { border-bottom: 0; border-radius: 6px; }
.fdiff.closed .fdiff-body { display: none; }
.fdiff-body { overflow-x: auto; }
table.diff { width: 100%; border-collapse: collapse; font: 12px/20px var(--mono); table-layout: fixed; }
table.diff td { padding: 0 10px; vertical-align: top; white-space: pre-wrap; word-wrap: break-word; }
table.diff td.ln { text-align: right; color: var(--muted); user-select: none; padding: 0 10px 0 6px; }
table.diff td.mk { user-select: none; padding: 0; text-align: center; color: var(--muted); }
table.diff tr.rins td { background: var(--add-line); }
table.diff tr.rins td.ln { background: var(--add-num); }
table.diff tr.rdel td { background: var(--del-line); }
table.diff tr.rdel td.ln { background: var(--del-num); }
table.diff td.c-ins { background: var(--add-line); }
table.diff td.c-del { background: var(--del-line); }
table.diff td.n-ins { background: var(--add-num); }
table.diff td.n-del { background: var(--del-num); }
table.diff td.empty { background: var(--subtle); }
table.diff ins { background: var(--add-word); text-decoration: none; border-radius: 2px; }
table.diff del { background: var(--del-word); text-decoration: none; border-radius: 2px; }
table.diff tr.hunk td { background: var(--hunk-bg); color: var(--muted); padding-top: 4px; padding-bottom: 4px; }
table.diff tr.hunk td.ln { background: var(--hunk-num); }
table.diff tr.hunk button { background: none; border: 0; color: var(--accent); cursor: pointer; font: 12px var(--mono); padding: 0; }
.nochange { padding: 16px; color: var(--muted); text-align: center; }

/* Drafts */
.aheadbehind { display: inline-grid; grid-template-columns: 60px 60px; font-size: 12px; color: var(--muted); }
.aheadbehind .b { text-align: right; padding-right: 4px; border-right: 1px solid var(--border); }
.aheadbehind .a { padding-left: 4px; }
.aheadbehind .bar { height: 4px; border-radius: 2px; margin-top: 2px; background: var(--border); }
.aheadbehind .b .bar { margin-left: auto; }

/* Spreadsheets */
.sheet-tabs { display: flex; gap: 4px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sheet-tabs button[data-sheet] { border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sheet-tabs button[data-sheet][aria-pressed="true"] { border-color: var(--border); background: var(--canvas); color: var(--fg); font-weight: 600; }
.sheet-wrap { overflow: auto; max-height: 70vh; border-radius: 0 0 6px 6px; }
.sheet-grid { border-collapse: collapse; font-size: 13px; }
.sheet-grid th { position: sticky; top: 0; background: var(--subtle); color: var(--muted); font: 500 11px var(--font); padding: 4px 8px; border: 1px solid var(--border-muted); min-width: 40px; z-index: 1; }
.sheet-grid tbody th { position: sticky; left: 0; text-align: right; }
.sheet-grid th.corner { left: 0; z-index: 2; }
.sheet-grid td { border: 1px solid var(--border-muted); padding: 4px 8px; min-width: 110px; max-width: 320px; white-space: pre-wrap; word-break: break-word; vertical-align: top; background: var(--canvas); }
.sheet-grid td:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.sheet-grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sheet-grid td.fx { font-family: var(--mono); font-size: 12px; color: var(--done); }
.sheet-grid.mini td { min-width: 60px; font-size: 12px; padding: 2px 6px; }
.csep { display: inline-block; width: 1px; height: 14px; background: var(--muted); opacity: .5; margin: 0 10px; vertical-align: middle; }

/* Import */
.dropzone { border: 2px dashed var(--border); border-radius: 6px; padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.dropzone.over { border-color: var(--accent); background: var(--accent-subtle); }
.dropzone svg.oc { width: 32px; height: 32px; color: var(--muted); }
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 16px 0; }
.source { display: flex; flex-direction: column; }
.source .Box-header strong { font-size: 14px; }
.source .Box-body { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.source ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; }
.source ol li { margin: 2px 0; }
.source .fmt { display: flex; gap: 4px; flex-wrap: wrap; }
.source .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.srcicon svg.oc { color: #fff; }
.srcicon { min-width: 24px; padding: 0 4px; height: 24px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.import-opts { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; padding: 12px 16px; }
.import-opts label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 220px; }
.import-opts label.check { flex-direction: row; align-items: center; font-weight: 400; min-width: 0; }
.log li { font-size: 13px; }
.log { margin: 0; padding: 0; list-style: none; }
.log li { padding: 6px 16px; border-top: 1px solid var(--border-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.log li:first-child { border-top: 0; }


/* Header button + avatars */
.gh .mark { background: none; border: 0; cursor: pointer; padding: 0; font: inherit; }
.gh .av-btn { padding: 2px 10px 2px 3px; }
img.av { border-radius: 50%; display: inline-block; vertical-align: middle; flex: none; background: var(--subtle); box-shadow: 0 0 0 1px var(--border-muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; display: inline-block; flex: none; }
.spinner.sm { width: 12px; height: 12px; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.sec-h { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.open-ic { color: var(--success-fg); } .merged-ic { color: var(--done); } .closed-ic { color: var(--danger); }
.unav.sub { border-bottom: 1px solid var(--border); }

/* Home */
.home { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 24px; }
@media (max-width: 1100px) { .home { grid-template-columns: 240px minmax(0, 1fr); } .home-right { grid-column: 1 / -1; } }
@media (max-width: 760px) { .home { grid-template-columns: 1fr; } }
.home-h { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
.proj-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.proj-list li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.proj-list li button { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 600; font-size: 14px; min-width: 0; flex: 1; text-align: left; }
.proj-list li button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row { align-items: flex-start; }
.feed-row svg.oc { margin-top: 3px; color: var(--muted); }

/* Profile */
.profile { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 32px; }
@media (max-width: 860px) { .profile { grid-template-columns: 1fr; } }
.profile aside img.av, .profile aside .avatar { width: 100% !important; height: auto !important; max-width: 260px; aspect-ratio: 1; font-size: 64px; }
.pf-name { font-size: 24px; font-weight: 600; margin: 16px 0 0; line-height: 1.25; }
.pf-login { font-size: 20px; font-weight: 300; color: var(--muted); margin-bottom: 12px; }
.pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.pin { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.pin p { margin: 0; font-size: 12px; flex: 1; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; }
.heatmap { display: block; max-width: 100%; height: auto; }
.hm-t { font: 10px var(--font); fill: var(--muted); }
.hm0 { fill: #eff2f5; } .hm1 { fill: #aceebb; } .hm2 { fill: #4ac26b; } .hm3 { fill: #2da44e; } .hm4 { fill: #116329; }
.hm { stroke: rgba(31,35,40,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hm0 { fill: #151b23; } :root:not([data-theme="light"]) .hm1 { fill: #033a16; } :root:not([data-theme="light"]) .hm2 { fill: #196c2e; } :root:not([data-theme="light"]) .hm3 { fill: #2ea043; } :root:not([data-theme="light"]) .hm4 { fill: #56d364; } :root:not([data-theme="light"]) .hm { stroke: rgba(240,246,252,.06); } }
:root[data-theme="dark"] .hm0 { fill: #151b23; } :root[data-theme="dark"] .hm1 { fill: #033a16; } :root[data-theme="dark"] .hm2 { fill: #196c2e; } :root[data-theme="dark"] .hm3 { fill: #2ea043; } :root[data-theme="dark"] .hm4 { fill: #56d364; }

/* Reviews & notes */
.pr-head { border-bottom: 1px solid var(--border-muted); padding-bottom: 12px; margin-bottom: 8px; }
.pr-head h1 { font-size: 26px; font-weight: 400; margin: 0 0 8px; text-wrap: balance; }
.state { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 2em; color: #fff; font-weight: 500; font-size: 14px; }
.state svg.oc { color: #fff; }
.state.open { background: var(--success); } .state.merged { background: var(--done); } .state.closed { background: var(--danger); }
.tl { display: flex; flex-direction: column; gap: 16px; position: relative; }
.tl-c { display: flex; gap: 12px; align-items: flex-start; }
.tl-c .cmt { flex: 1; min-width: 0; }
.cmt .Box-header { padding: 8px 16px; font-size: 14px; }
.cmt.ok { border-color: var(--success-fg); } .cmt.ok .Box-header { background: color-mix(in srgb, var(--success-fg) 10%, var(--subtle)); }
.cmt.bad { border-color: var(--danger); } .cmt.bad .Box-header { background: color-mix(in srgb, var(--danger) 8%, var(--subtle)); }
.tl-ev { display: flex; gap: 8px; align-items: center; margin-left: 56px; font-size: 14px; }
.tl-ev.ok svg.oc { color: var(--success-fg); } .tl-ev.bad svg.oc { color: var(--danger); }
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md blockquote, blockquote.quote { margin: 0 0 8px; padding: 0 12px; color: var(--muted); border-left: 3px solid var(--border); }
.md code { font-family: var(--mono); font-size: 85%; background: var(--subtle); padding: 2px 5px; border-radius: 6px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md h3, .md h4, .md h5, .md h6 { margin: 8px 0; }
.merge-box { margin: 16px 0 0 44px; border-width: 1px; }
.merge-box.ok { border-color: var(--success-fg); }
.merge-box.ok .row svg.oc { color: var(--success-fg); }
.addc { position: absolute; margin-left: -34px; margin-top: 1px; width: 20px; height: 20px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font: 600 14px/20px var(--font); cursor: pointer; opacity: 0; transform: scale(.85); transition: opacity .1s, transform .1s; }
table.diff tr:hover .addc, .addc:focus-visible { opacity: 1; transform: none; }
.gl { display: inline-flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; line-height: 20px; border-radius: 2em; background: color-mix(in srgb, var(--lc) 18%, transparent); color: color-mix(in srgb, var(--lc) 70%, var(--fg)); border: 1px solid color-mix(in srgb, var(--lc) 40%, transparent); white-space: nowrap; }
.lbtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 2em; }
.lbtn:not(.on) .gl { opacity: .55; }
.note-side .lbtn:not(.on) .gl { opacity: .45; }
.note-layout { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; margin-top: 16px; }
@media (max-width: 860px) { .note-layout { grid-template-columns: 1fr; } }
.side-h { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }

/* Insights */
.insights { display: flex; flex-direction: column; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.tile { border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
.tile-n { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.ins-two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .ins-two { grid-template-columns: 1fr; } }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .grid { stroke: var(--border-muted); stroke-width: 1; }
svg.chart .tick { font: 11px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
svg.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .area { fill: var(--accent); opacity: .1; }
svg.chart .pt { fill: var(--accent); stroke: var(--canvas); stroke-width: 2; }
svg.chart .pt.on { r: 6; }
svg.chart .endlbl { font: 600 12px var(--font); fill: var(--fg); }
svg.chart .xh { stroke: var(--muted); stroke-dasharray: 3 3; }
svg.chart .hit { cursor: pointer; }
.tip { position: absolute; z-index: 3; background: var(--canvas); border: 1px solid var(--border); box-shadow: var(--overlay-shadow); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 240px; pointer-events: none; }

/* Line history */
table.blame td.bmeta { width: 280px; max-width: 280px; padding: 0 10px; font: 12px/20px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.blame td.bmeta .link { color: var(--fg); }
table.blame tr.bstart td { border-top: 1px solid var(--border-muted); }
table.blame td.bage { width: 4px; padding: 0; }
.bage.a1 { background: #ffdfb6; } .bage.a2 { background: #ffc680; } .bage.a3 { background: #f0883e; } .bage.a4 { background: #db6d28; } .bage.a5 { background: #bd561d; }

/* Settings */
.settings { max-width: 860px; }
.set-h { font-size: 20px; font-weight: 400; margin: 24px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-muted); }
.set-h:first-child { margin-top: 0; }
.danger-h { color: var(--danger); }
.Box.danger { border-color: var(--danger); }
fieldset.vis { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
fieldset.vis legend { font-weight: 600; margin-bottom: 6px; }
fieldset.vis label.check { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 400; }
.mbody label.check { flex-direction: row; align-items: center; gap: 8px; }


/* Side-by-side pages (writer's view) */
:root { --desk: #eef1f5; --page: #ffffff; --page-edge: #d8dee4; --page-ink: #1f2328; --ins-ink: #116329; --ins-bg: rgba(46,160,67,.14); --del-ink: #a40e26; --del-bg: rgba(207,34,46,.08); --bar-ins: #2da44e; --bar-del: #cf222e; --page-font: "Charter", "Iowan Old Style", "Source Serif Pro", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --desk: #010409; --page: #161b22; --page-edge: #30363d; --page-ink: #e6edf3; --ins-ink: #56d364; --ins-bg: rgba(46,160,67,.2); --del-ink: #ff7b72; --del-bg: rgba(248,81,73,.12); --bar-ins: #3fb950; --bar-del: #f85149; } }
:root[data-theme="dark"] { --desk: #010409; --page: #161b22; --page-edge: #30363d; --page-ink: #e6edf3; --ins-ink: #56d364; --ins-bg: rgba(46,160,67,.2); --del-ink: #ff7b72; --del-bg: rgba(248,81,73,.12); --bar-ins: #3fb950; --bar-del: #f85149; }
.docdiff { display: grid; grid-template-columns: minmax(300px, 1fr) 76px minmax(300px, 1fr); background: var(--desk); padding: 24px 20px 28px; min-width: 720px; }
.docdiff .dc, .docdiff .dhead, .docdiff .dfoot { background: var(--page); border-left: 1px solid var(--page-edge); border-right: 1px solid var(--page-edge); color: var(--page-ink); }
.docdiff .dhead { border-top: 1px solid var(--page-edge); border-radius: 4px 4px 0 0; padding: 14px 48px 14px; border-bottom: 1px solid var(--page-edge); margin-bottom: 0; box-shadow: 0 -1px 0 rgba(0,0,0,.02); }
.docdiff .dhead + .dg, .docdiff .dg-head { background: transparent; }
.dtitle { display: flex; align-items: center; gap: 6px; font: 600 11px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dhead.R .dtitle { color: var(--ins-ink); } .dhead.L .dtitle { color: var(--muted); }
.dsub { font: 600 15px/1.35 var(--font); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dmeta { font: 12px var(--font); color: var(--muted); margin-top: 2px; }
.docdiff .dfoot { border-bottom: 1px solid var(--page-edge); border-radius: 0 0 4px 4px; height: 36px; box-shadow: 0 6px 14px rgba(31,35,40,.06); }
.docdiff .dc { position: relative; padding: 0 48px; font: 15.5px/1.7 var(--page-font); white-space: pre-wrap; word-wrap: break-word; }
.docdiff .dc.blank { min-height: .8em; }
.docdiff .dc.h1 { font: 700 1.55em/1.3 var(--font); padding-top: .5em; padding-bottom: .15em; }
.docdiff .dc.h2 { font: 700 1.2em/1.35 var(--font); padding-top: .55em; padding-bottom: .1em; }
.docdiff .dc.h3 { font: 600 1.05em/1.4 var(--font); padding-top: .45em; }
.docdiff .dc.li { padding-left: 68px; }
.docdiff .dc.li .bul { position: absolute; left: 52px; color: var(--muted); }
.docdiff .dc.quote { color: var(--muted); font-style: italic; box-shadow: inset 51px 0 0 var(--page), inset 54px 0 0 var(--page-edge); padding-left: 64px; }
.docdiff .dc.src { font: 11.5px/1.75 var(--mono); color: var(--muted); opacity: .85; }
.docdiff .dc .dcite { font: .85em var(--font); color: var(--accent); }
.docdiff .dc .dlink { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.docdiff .dc.chg::before, .docdiff .dc.add::before, .docdiff .dc.cut::before { content: ""; position: absolute; left: 22px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; }
.docdiff .dc.L.chg::before, .docdiff .dc.cut::before { background: var(--bar-del); }
.docdiff .dc.R.chg::before, .docdiff .dc.add::before { background: var(--bar-ins); }
.docdiff .dc.cut { color: var(--del-ink); text-decoration: line-through; text-decoration-thickness: 1px; background: linear-gradient(var(--del-bg), var(--del-bg)) var(--page); }
.docdiff .dc.add { color: var(--ins-ink); background: linear-gradient(var(--ins-bg), var(--ins-bg)) var(--page); }
.docdiff .dc.empty { background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--desk) 6px 7px); opacity: .9; }
.docdiff del { color: var(--del-ink); text-decoration: line-through; text-decoration-thickness: 1.5px; background: var(--del-bg); border-radius: 2px; }
.docdiff ins { color: var(--ins-ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; background: var(--ins-bg); border-radius: 2px; }
.docdiff .dg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px 0; }
.dchip { font: 600 10.5px/1 var(--font); padding: 3px 7px; border-radius: 2em; border: 1px solid var(--border); background: var(--canvas); color: var(--muted); white-space: nowrap; }
.dchip.add { color: var(--ins-ink); border-color: var(--bar-ins); } .dchip.cut { color: var(--del-ink); border-color: var(--bar-del); } .dchip.edit { color: var(--attention); border-color: var(--attention); }
.dnum { font: 10.5px var(--font); font-variant-numeric: tabular-nums; }
.docdiff .dfold { grid-column: 1 / -1; display: flex; justify-content: center; padding: 6px 0; background: linear-gradient(to right, var(--page) 0 calc(50% - 38px), transparent calc(50% - 38px) calc(50% + 38px), var(--page) calc(50% + 38px)); border-left: 1px solid var(--page-edge); border-right: 1px solid var(--page-edge); }
.docdiff .dfold button { font: 12px var(--font); color: var(--accent); background: var(--canvas); border: 1px dashed var(--border); border-radius: 2em; padding: 3px 12px; cursor: pointer; }
.docdiff .dhid:not([hidden]) { display: contents; }
.addc.doc { margin-left: 0; left: 4px; top: 4px; }
.docdiff .dc:hover .addc, .docdiff .addc:focus-visible { opacity: 1; transform: none; }


/* Live collaboration */
.live-box { margin-bottom: 16px; }
.live-box .Box-header .srcicon svg.oc { color: #fff; }
.live-state { display: inline-flex; gap: 6px; align-items: center; }
.live-cmt { align-items: flex-start; }
.live-cmt .avatar { margin-top: 2px; }
label.prov.dis { opacity: .55; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.live-flash .label { vertical-align: middle; }
.flash .btn-primary svg.oc, .Box-row .btn-primary svg.oc { color: #fff; }

/* Dialog + toast */
.overlay { position: fixed; inset: 0; background: rgba(31,35,40,.5); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px; z-index: 50; }
.modal { width: min(560px, 100%); background: var(--canvas); border-radius: 12px; box-shadow: var(--overlay-shadow); display: flex; flex-direction: column; max-height: 80vh; }
.mhead { display: flex; align-items: center; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border-muted); }
.mhead h3 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }
.mbody { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.mbody label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
.mactions { padding: 16px; border-top: 1px solid var(--border-muted); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.mbody p { margin: 0; }
.paste-target { min-height: 160px; max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; background: var(--canvas); }
.paste-target:empty::before { content: attr(data-ph); color: var(--muted); }
.copybox { width: 100%; min-height: 200px; font: 12px/1.5 var(--mono); border: 1px solid var(--border); border-radius: 6px; padding: 8px; background: var(--subtle); }
.toast { position: fixed; bottom: 24px; left: 24px; background: var(--fg); color: var(--canvas); padding: 10px 16px; border-radius: 6px; font-size: 14px; z-index: 60; box-shadow: var(--overlay-shadow); max-width: 90vw; }
@media (max-width: 600px) { .container, .repohead, .gh { padding-left: 16px; padding-right: 16px; } .ftable td.msg, .ftable td.when { display: none; } .ftable td.nm { width: auto; } }
@media (prefers-reduced-motion: no-preference) { .btn, .Box-row, .ftable td { transition: background-color .08s; } }
/* References */
.rf-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rf-bar input[type=text] { flex: 1 1 220px; min-width: 160px; height: 28px; }
.rf-row { align-items: flex-start; gap: 8px; }
.rf-row .label, .rf-row .rf-key { flex-shrink: 0; margin-top: 2px; }
.rf-title { font-weight: 600; font-size: 14px; text-align: left; color: var(--fg); line-height: 1.4; }
.rf-title:hover { color: var(--accent); }
.rf-meta { font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-key { font-family: var(--mono); font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-row.open { background: var(--canvas-subtle); }
.rf-detail { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.rf-formatted, .rf-biblio p { font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.6; padding-left: 2em; text-indent: -2em; margin: 0; }
.rf-formatted { background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px 12px calc(16px + 2em); }
.rf-biblio { background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }

    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="mhead"><h3 id="m-title">${esc(title)}</h3><button class="btn-octicon" data-x aria-label="Close">${ICON.x}</button></div><div class="mbody">${body}</div><div class="mactions"></div></div>`;
    const close = val => { ov.remove(); document.removeEventListener("keydown", onKey); resolve(val); };
    const onKey = e => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", e => { if (e.target === ov) close(null); });
    ov.querySelector("[data-x]").onclick = () => close(null);
    const bar = $(".mactions", ov);
    actions.slice().reverse().forEach(a => {
      const b = document.createElement("button");
      b.className = "btn" + (a.primary ? " btn-primary" : "") + (a.danger ? " btn-danger" : ""); b.textContent = a.label;

}

/* ============ File (write / preview) ============ */

    <div class="Box" style="margin-bottom:16px"><div class="Box-row" style="flex-wrap:wrap">
      ${lt ? `${avatarImg(ghImgOk() ? p.versions[lt].avatar : null, p.versions[lt].login || ME, 20)}${whoOf(p.versions[lt])}<button class="link link-muted" data-v="${lt}" style="color:var(--fg)">${esc(p.versions[lt].message)}</button><span class="grow"></span><span class="muted sha">${lt.slice(0, 7)}</span><span class="muted">· ${ago(p.versions[lt].time)}</span>` : `<span class="muted">Not in any saved version yet.</span><span class="grow"></span>`}
      <button class="btn btn-sm" data-tab="history">${ic("history")} History</button></div></div>
    ${liveOf(p, path) ? `<div class="flash info live-flash">${ic("people")}<span>Live in <strong>${esc(liveTarget(liveOf(p, path).provider, path))}</strong> · <span data-lst>${liveOf(p, path).lastSeen ? liveStateHtml(liveOf(p, path)) : "shared " + ago(liveOf(p, path).sharedAt)}</span></span><span class="grow"></span><button class="btn btn-sm btn-primary" data-lback>${ic("import")} Bring changes back</button><a class="btn btn-sm" href="${esc(liveOf(p, path).url)}" target="_blank" rel="noopener">Open</a></div>` : ""}
    ${docx || sheet ? `<div class="flash info" id="docx-note">${ic("info")}<span>${noteFor(path, f)}</span></div>` : ""}

        <div class="seg" role="group" aria-label="Mode"><button aria-pressed="${mode === "write"}" data-mode="write">${ic(sheet ? "fileSheet" : "pencil")} ${sheet ? "Cells" : "Write"}</button><button aria-pressed="${mode === "preview"}" data-mode="preview">${sheet ? "As text" : "Preview"}</button><button aria-pressed="${mode === "blame"}" data-mode="blame" title="Which version last changed each ${docx ? "paragraph" : sheet ? "row" : "line"}">${ic("history")} Line history</button></div>

    </div>`;

  el.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => go("files", { dir: b.dataset.dir }));

  };
}


function noteFor(path, f) {
  if (kindOf(path) === "sheet") return f.orig
    ? "Spreadsheet: values and formulas are versioned cell by cell, one row at a time. The original file, with its formatting and charts, is kept until you edit."
    : "Edited spreadsheet: downloads rebuild the workbook with values and formulas only. Earlier versions keep their original files.";
  return f.orig ? "Word document: you're editing its text, one paragraph per line. The original .docx and its formatting are kept until you edit."
    : "Edited Word text: “Original” downloads rebuild a plain .docx. Earlier versions keep their original files.";
}
function sheetGrid(p, path, f, mount, onEdit) {
  const sheets = textToSheets(f.text);
  S.sheetIdx = S.sheetIdx && S.sheetFile === path && S.sheetIdx < sheets.length ? S.sheetIdx : 0; S.sheetFile = path;
  const sh = sheets[S.sheetIdx];
  const MAXR = 500, MAXC = 52;
  const nCols = Math.min(MAXC, Math.max(4, ...sh.rows.map(r => r.length)) + 1), nRows = Math.min(MAXR, Math.max(10, sh.rows.length + 1));
  const big = sh.rows.length >= MAXR || sh.rows.some(r => r.length >= MAXC);
  const isNum = v => /^-?[\d,]*\.?\d+%?$/.test(v);
  mount.innerHTML = `<div class="sheet-tabs">${sheets.map((s, i) => `<button data-sheet="${i}" aria-pressed="${i === S.sheetIdx}">${ic("fileSheet")} ${esc(s.name)}</button>`).join("")}
      <button class="btn-octicon" id="add-sheet" title="Add sheet" aria-label="Add sheet">${ic("plus")}</button><span class="grow"></span>
      <span class="muted" style="font-size:12px">${big ? "Large sheet: showing the first " + MAXR + " rows and " + MAXC + " columns." : "Click a cell to edit. Start with = for a formula."}</span></div>
    <div class="sheet-wrap"><table class="sheet-grid"><thead><tr><th class="corner"></th>${Array.from({ length: nCols }, (_, c) => `<th>${colName(c)}</th>`).join("")}</tr></thead><tbody>
      ${Array.from({ length: nRows }, (_, r) => `<tr><th>${r + 1}</th>${Array.from({ length: nCols }, (_, c) => { const v = (sh.rows[r] || [])[c] || ""; return `<td contenteditable="true" spellcheck="false" data-r="${r}" data-c="${c}" class="${v.startsWith("=") ? "fx" : isNum(v) ? "num" : ""}">${esc(v)}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div>`;
  let grew = false;
  mount.querySelectorAll("[data-sheet]").forEach(b => b.onclick = () => { S.sheetIdx = +b.dataset.sheet; sheetGrid(p, path, f, mount, onEdit); });
  $("#add-sheet", mount).onclick = async () => {
    const name = await askText("Add sheet", "Sheet name", "Sheet" + (sheets.length + 1), "Add"); if (!name) return;
    sheets.push({ name, rows: [] }); f.text = sheetsToText(sheets); S.sheetIdx = sheets.length - 1; onEdit(); sheetGrid(p, path, f, mount, onEdit);
  };
  const tbody = mount.querySelector("tbody");
  tbody.addEventListener("input", e => {
    const td = e.target.closest("td"); if (!td) return;
    const r = +td.dataset.r, c = +td.dataset.c, v = td.textContent.replace(/\t/g, " ").replace(/\n/g, " ");
    while (sh.rows.length <= r) sh.rows.push([]);
    const row = sh.rows[r]; while (row.length <= c) row.push("");
    row[c] = v; td.className = v.startsWith("=") ? "fx" : isNum(v) ? "num" : "";
    if (r >= nRows - 1 || c >= nCols - 1) grew = true;
    f.text = sheetsToText(sheets); onEdit();
  });
  tbody.addEventListener("keydown", e => {
    const td = e.target.closest("td"); if (!td) return;
    if (e.key === "Enter") { e.preventDefault(); const next = tbody.querySelector(`td[data-r="${+td.dataset.r + 1}"][data-c="${td.dataset.c}"]`); if (next) next.focus(); }
  });
  tbody.addEventListener("paste", e => {
    const td = e.target.closest("td"); if (!td) return;
    const txt = e.clipboardData.getData("text/plain"); if (!txt.includes("\t") && !txt.includes("\n")) return;
    e.preventDefault();
    const block = parseDelimited(txt.replace(/\n$/, ""), "\t"), r0 = +td.dataset.r, c0 = +td.dataset.c;
    block.forEach((cells, i) => { while (sh.rows.length <= r0 + i) sh.rows.push([]); const row = sh.rows[r0 + i]; cells.forEach((v, j) => { while (row.length <= c0 + j) row.push(""); row[c0 + j] = v.replace(/\n/g, " "); }); });
    f.text = sheetsToText(textToSheets(sheetsToText(sheets))); onEdit(); sheetGrid(p, path, f, mount, onEdit); toast(`Pasted ${block.length} row${block.length > 1 ? "s" : ""}.`);
  });
  tbody.addEventListener("focusout", () => { if (grew) { grew = false; setTimeout(() => { if (!mount.contains(document.activeElement)) sheetGrid(p, path, f, mount, onEdit); }, 0); } });
}

/* ============ History ============ */
function viewHistory(p, el) {
  const head = headId(p);
  const ids = [...ancestors(p, head)].sort((a, b) => p.versions[b].time - p.versions[a].time);
  const groups = []; for (const id of ids) { const d = shortDate(p.versions[id].time); const g = groups.at(-1); if (g && g.d === d) g.ids.push(id); else groups.push({ d, ids: [id] }); }
  const ch = changedPaths(p);
  el.innerHTML = `
    <div class="filebar">${draftPicker(p)}<span class="grow"></span><button class="btn" data-tab="compare">${ic("compare")} Compare versions</button></div>
    ${ch.length ? `<div class="tl-group"><div class="tl-date"><span class="dot">${ic("pencil")}</span>Not saved yet</div>
      <div class="Box" style="border-style:dashed"><div class="vrow"><div class="vmain"><div class="vmsg"><strong>Unsaved changes</strong>${ch.map(c => `<span class="label">${esc(c.path)}</span>`).join("")}</div></div>
      <div class="vacts"><button class="btn btn-sm" data-review>Review</button><button class="btn btn-sm btn-primary" data-save>Save version</button></div></div></div></div>` : ""}
    ${groups.map(g => `<div class="tl-group"><div class="tl-date"><span class="dot">${ic("commit")}</span>Versions on ${g.d}</div><div class="Box">
      ${g.ids.map(id => {
        const v = p.versions[id], s = versionStat(p, id), ms = milestonesOf(p, id), heads = draftHeadsAt(p, id);
        return `<div class="vrow"><div class="vmain">
          <div class="vmsg"><button class="link" data-v="${id}">${esc(v.message)}</button>${ms.map(m => `<span class="label label-done">${ic("milestone")}${esc(m)}</span>`).join("")}${heads.map(h => `<span class="branch-name">${esc(h)}</span>`).join("")}</div>
          <div class="vmeta">${avatarImg(ghImgOk() ? v.avatar : null, v.login || v.author || ME, 20)}${whoOf(v)} saved <span title="${fullDate(v.time)}">${ago(v.time)}</span>${v.draft !== "main" ? ` on <span class="branch-name">${esc(v.draft)}</span>` : ""}
            · ${s.files} file${s.files === 1 ? "" : "s"} · <span class="add">+${s.ins}</span> <span class="del">−${s.del}</span> words ${diffstatBlocks(s.ins, s.del)}${v.parent2 ? ` · <span class="label">${ic("merge")}merge</span>` : ""}</div></div>
          <div class="vacts"><button class="btn btn-sm sha" data-v="${id}" title="View changes">${id.slice(0, 7)}</button>
            <button class="btn btn-sm" data-restore="${id}" title="Make this the current text">${ic("undo")} Restore</button>
            <button class="btn-octicon" data-branch="${id}" title="New draft from here" aria-label="New draft from here">${ic("branch")}</button>
            <button class="btn-octicon" data-mile="${id}" title="${ms.length ? "Edit milestone" : "Add milestone"}" aria-label="Milestone">${ic("milestone")}</button>
            <button class="btn-octicon" data-dl="${id}" title="Download this version (.zip)" aria-label="Download">${ic("download")}</button></div></div>`;
      }).join("")}</div></div>`).join("")}

/* ============ Diff rendering ============ */
function renderDiffs(p, a, b, mount, opts = {}) {
  const paths = [...new Set([...(a ? refPaths(p, a) : []), ...refPaths(p, b)])].sort();
  const files = paths.filter(x => refText(p, a, x) !== refText(p, b, x) || refExists(p, a, x) !== refExists(p, b, x)).map(path => ({ path, ...buildRows(refText(p, a, path), refText(p, b, path)) }));
  const ins = files.reduce((s, f) => s + f.ins, 0), del = files.reduce((s, f) => s + f.del, 0);

  mount.innerHTML = `<div class="toc"><span>Showing <strong>${files.length} changed file${files.length > 1 ? "s" : ""}</strong> with <span class="add">${ins} added</span> and <span class="del">${del} removed</span> words.</span>
      <div class="seg" role="group" aria-label="Diff layout"><button aria-pressed="${S.mode === "unified"}" data-dm="unified">Unified</button><button aria-pressed="${S.mode === "split"}" data-dm="split">${ic("compare")} Side by side</button></div></div>
    ${files.map((f, i) => {
      const inA = a ? refExists(p, a, f.path) : false, inB = refExists(p, b, f.path);
      return `<div class="fdiff" id="fd-${i}"><div class="fdiff-head"><button class="btn-octicon" data-toggle="${i}" aria-label="Collapse file">${ic("chevd")}</button>
        <span class="add">+${f.ins}</span><span class="del">−${f.del}</span>${diffstatBlocks(f.ins, f.del)}${fileIcon(f.path)}<span class="fn">${esc(f.path)}</span>
        ${!inA ? `<span class="label label-success">New</span>` : !inB ? `<span class="label label-danger">Removed</span>` : ""}<span class="label">${typeLabel(f.path)}</span>
        <span class="grow"></span>${p.working[f.path] ? `<button class="btn btn-sm" data-open="${esc(f.path)}">View file</button>` : ""}</div>
        <div class="fdiff-body" data-path="${esc(f.path)}">${S.mode === "split" && kindOf(f.path) !== "sheet"
          ? docSplit(f.rows, f.path, [pageHead(p, a, f.path, "Before"), pageHead(p, b, f.path, "After")], !!opts.onComment)
          : diffTable(f.rows, S.mode, f.path, kindOf(f.path) === "sheet" ? [sheetRowLabels(refText(p, a, f.path)), sheetRowLabels(refText(p, b, f.path))] : null, !!opts.onComment)}</div></div>`;
    }).join("")}`;
  mount.querySelectorAll("[data-dm]").forEach(x => x.onclick = () => { S.mode = x.dataset.dm; renderDiffs(p, a, b, mount, opts); });
  if (opts.onComment) mount.querySelectorAll("[data-cm]").forEach(x => x.onclick = () => { const body = x.closest(".fdiff-body"); opts.onComment(body.dataset.path, x.dataset.cl, x.dataset.cm); });
  mount.querySelectorAll("[data-toggle]").forEach(x => x.onclick = () => { const box = $("#fd-" + x.dataset.toggle, mount); box.classList.toggle("closed"); x.innerHTML = box.classList.contains("closed") ? ic("chevr") : ic("chevd"); });
  mount.querySelectorAll("[data-open]").forEach(x => x.onclick = () => go("file", { file: x.dataset.open }));
  mount.querySelectorAll("[data-dexp]").forEach(x => x.onclick = () => { const h = x.closest(".dfold").nextElementSibling; if (h) h.hidden = false; x.closest(".dfold").remove(); });
  mount.querySelectorAll("[data-exp]").forEach(x => x.onclick = () => { const tb = x.closest("tbody").nextElementSibling; if (tb && tb.hasAttribute("hidden")) { tb.hidden = false; x.closest("tbody").querySelectorAll("[data-exp]").forEach(e => e.remove()); } });
}
function diffTable(rows, mode, file, labels, commentable) {
  const docx = kindOf(file) === "docx", sheet = kindOf(file) === "sheet", unit = unitName(file);
  let side = 0;
  const lnA = n => n ? (labels ? labels[0][n - 1] : docx ? "¶" + n : n) : "", lnB = n => n ? (labels ? labels[1][n - 1] : docx ? "¶" + n : n) : "";
  const fmt = h => !sheet ? h : h.startsWith(esc(SHEET_HDR)) ? `<strong>${ic("fileSheet")} ${h.slice(esc(SHEET_HDR).length)}</strong>` : h.replace(/\t/g, '<span class="csep"></span>');
  const split = mode === "split";
  const plain = h => (h || "").replace(/<[^>]+>/g, "");
  const cbtn = (r, html, n) => commentable ? `<button class="addc" data-cm="${plain(html)}" data-cl="${esc(String(n || ""))}" title="Comment on this" aria-label="Comment on this">+</button>` : "";
  const rowHtml0 = r => {
    if (split) {
      if (r.t === "=") return `<tr><td class="ln">${lnA(r.a)}</td><td>${fmt(r.text) || " "}</td><td class="ln">${lnB(r.b)}</td><td>${fmt(r.text) || " "}</td></tr>`;
      if (r.t === "~") return `<tr><td class="ln n-del">${lnA(r.a)}</td><td class="c-del">${fmt(r.L) || " "}</td><td class="ln n-ins">${lnB(r.b)}</td><td class="c-ins">${fmt(r.R) || " "}</td></tr>`;
      if (r.t === "-") return `<tr><td class="ln n-del">${lnA(r.a)}</td><td class="c-del">${fmt(r.text) || " "}</td><td class="ln empty"></td><td class="empty"></td></tr>`;
      return `<tr><td class="ln empty"></td><td class="empty"></td><td class="ln n-ins">${lnB(r.b)}</td><td class="c-ins">${fmt(r.text) || " "}</td></tr>`;
    }
    if (r.t === "=") return `<tr><td class="ln">${lnA(r.a)}</td><td class="ln">${lnB(r.b)}</td><td class="mk"> </td><td>${fmt(r.text) || " "}</td></tr>`;
    if (r.t === "~") return `<tr class="rdel"><td class="ln">${lnA(r.a)}</td><td class="ln"></td><td class="mk">-</td><td>${fmt(r.L) || " "}</td></tr><tr class="rins"><td class="ln"></td><td class="ln">${lnB(r.b)}</td><td class="mk">+</td><td>${fmt(r.R) || " "}</td></tr>`;
    if (r.t === "-") return `<tr class="rdel"><td class="ln">${lnA(r.a)}</td><td class="ln"></td><td class="mk">-</td><td>${fmt(r.text) || " "}</td></tr>`;
    return `<tr class="rins"><td class="ln"></td><td class="ln">${lnB(r.b)}</td><td class="mk">+</td><td>${fmt(r.text) || " "}</td></tr>`;
  };
  const rowHtml = r => {
    let h = rowHtml0(r);
    if (!commentable || r.t === "=") return h;
    const txt = r.t === "~" ? r.R : r.text, n = r.t === "-" ? lnA(r.a) : lnB(r.b);
    return h.replace(/<td(?: class="(c-ins|c-del)")?>(?![\s\S]*<td)/, m => m + cbtn(r, txt, n));
  };
  const C = 3, ch = rows.map(r => r.t !== "=");
  const near = rows.map((_, i) => { for (let j = Math.max(0, i - C); j <= Math.min(rows.length - 1, i + C); j++) if (ch[j]) return true; return false; });
  const span = split ? 3 : 3;
  const hunk = (hidden, header) => `<tr class="hunk"><td class="ln">${hidden ? `<button data-exp title="Show ${hidden} unchanged ${unit}s" aria-label="Expand">⋯</button>` : ""}</td><td colspan="${span}">${header}${hidden ? ` <button data-exp>Show ${hidden} unchanged ${unit}${hidden === 1 ? "" : "s"}</button>` : ""}</td></tr>`;
  let html = "", i = 0;
  while (i < rows.length) {
    let hid = "", hn = 0;
    while (i < rows.length && !near[i]) { hid += rowHtml(rows[i++]); hn++; }
    if (i >= rows.length) { if (hn) html += `<tbody>${hunk(hn, "")}</tbody><tbody hidden>${hid}</tbody>`; break; }
    const chunk = []; while (i < rows.length && near[i]) chunk.push(rows[i++]);
    const as = chunk.filter(r => r.a), bs = chunk.filter(r => r.b);
    const header = `@@ -${as.length ? as[0].a : 0},${as.length} +${bs.length ? bs[0].b : 0},${bs.length} @@`;
    html += `<tbody>${hunk(hn, header)}</tbody>${hn ? `<tbody hidden>${hid}</tbody>` : ""}<tbody>${chunk.map(rowHtml).join("")}</tbody>`;
  }
  const cols = split ? `<col style="width:52px"><col><col style="width:52px"><col>` : `<col style="width:52px"><col style="width:52px"><col style="width:20px"><col>`;
  return `<table class="diff"><colgroup>${cols}</colgroup>${html}</table>`;
}


/* ============ Side-by-side "pages" view for prose (Word/Docs-like) ============ */
const unesc = s => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
const stripTags = h => (h || "").replace(/<[^>]+>/g, "");
function pageHead(p, ref, path, side) {
  const text = ref ? refText(p, ref, path) : "";
  const v = ref && ref !== "W" ? p.versions[ref] : null;
  const label = ref === "W" ? "Current text" : v ? v.message : "Not in this version";
  const when = ref === "W" ? "unsaved changes included" : v ? shortDate(v.time) + " · " + ref.slice(0, 7) : "";
  return { side, label, when, words: wordCount(text), exists: ref ? refExists(p, ref, path) : false };
}
const TEX_SRC = /^\\(documentclass|usepackage|begin|end|maketitle|title|author|date|input|include|bibliography|bibliographystyle|label|appendix|newcommand|renewcommand|setlength|tableofcontents|clearpage|newpage|centering)\b/;
function docLine(html, file) {
  const raw = unesc(stripTags(html)), ext = extOf(file), t = raw.trim();
  if (!t) return { cls: "blank", html: "" };
  let m, cls = "p", h = html;
  if (ext === "md" || ext === "markdown") {
    if ((m = /^(#{1,6})\s+/.exec(t))) { cls = "h" + Math.min(3, m[1].length); h = h.replace(/^(\s*)(<(?:ins|del)>)?#{1,6}\s+/, "$1$2"); }
    else if (/^\s*[-*]\s+/.test(raw)) { cls = "li"; h = h.replace(/^(\s*)(<(?:ins|del)>)?\s*[-*]\s+/, "$1$2"); }
    else if (/^\s*\d+\.\s+/.test(raw)) { cls = "li num"; }
    else if (/^>\s?/.test(t)) { cls = "quote"; h = h.replace(/^(\s*)(<(?:ins|del)>)?&gt;\s?/, "$1$2"); }
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>").replace(/\[([^\]]+)\]\([^)]*\)/g, '<span class="dlink">$1</span>');
  } else if (["tex", "cls", "sty"].includes(ext)) {
    if (/^%/.test(t) || TEX_SRC.test(t)) cls = "src";
    else if ((m = /^\\(sub)*section\*?\{/.exec(t))) { cls = (m[0].match(/sub/g) || []).length ? "h3" : "h2"; h = h.replace(/^\s*\\(?:sub)*section\*?\{([\s\S]*)\}\s*$/, "$1"); }

    if (cls !== "src") h = h.replace(/\\textbf\{([^{}]*)\}/g, "<strong>$1</strong>").replace(/\\(?:emph|textit)\{([^{}]*)\}/g, "<em>$1</em>")
      .replace(/\\cite[pt]?\{([^{}]*)\}/g, '<span class="dcite">[$1]</span>').replace(/---/g, "—").replace(/--/g, "–").replace(/``/g, "“").replace(/''/g, "”").replace(/\\%/g, "%").replace(/\\&amp;/g, "&amp;").replace(/~/g, " ");

}
function docSplit(rows, file, heads, commentable) {
  const docx = kindOf(file) === "docx", unit = unitName(file);
  const cell = (side, state, html, extra = "") => {
    if (state === "empty") return `<div class="dc ${side} empty"></div>`;
    const d = docLine(html, file);
    return `<div class="dc ${side} ${state} ${d.cls}">${extra}${d.cls === "li" ? '<span class="bul">•</span>' : ""}${d.html || (d.cls === "blank" ? "" : " ")}</div>`;
  };
  const chip = (kind, ins, del) => `<div class="dg"><span class="dchip ${kind}">${kind === "edit" ? "Edited" : kind === "add" ? "Added" : "Cut"}</span>${kind === "edit" ? `<span class="dnum"><span class="add">+${ins}</span> <span class="del">−${del}</span></span>` : ""}</div>`;
  const countIn = (h, tag) => { let n = 0; h.replace(new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`, "g"), (_, x) => { n += wordCount(unesc(x)); return ""; }); return n; };

    if (r.t === "~") return cell("L", "chg", r.L) + label("edit", countIn(r.R, "ins"), countIn(r.L, "del")) + cell("R", "chg", r.R, cb(r.R, docx ? "¶" + r.b : r.b));
    if (r.t === "-") return cell("L", "cut", r.text, cb(r.text, docx ? "¶" + r.a : r.a)) + label("cut") + cell("R", "empty");

  const head = h => `<div class="dhead ${h.side}"><div class="dtitle">${ic(docx ? "fileWord" : "file")}<span>${h.side}</span></div><div class="dsub" title="${esc(h.label)}">${esc(h.label)}</div><div class="dmeta">${h.exists ? `${h.when} · ${h.words.toLocaleString()} word${h.words === 1 ? "" : "s"}` : "file not present"}</div></div>`;

  while (i < rows.length) {
    if (near[i]) { body += rowHtml(rows[i++]); continue; }
    let hid = "", n = 0, k = 0; while (i < rows.length && !near[i]) { hid += rowHtml(rows[i++]); k++; if (rows[i - 1].text && stripTags(rows[i - 1].text).trim()) n++; }

    body += `<div class="dfold"><button data-dexp>⋯ ${n || "a few"} unchanged ${unit}${n === 1 ? "" : "s"}</button></div><div class="dhid" hidden>${hid}</div>`;
  }
  return `<div class="docdiff ${["md", "markdown", "tex", "cls", "sty", "bib"].includes(extOf(file)) ? "rendered" : ""}">${head(heads[0])}<div class="dg dg-head"></div>${head(heads[1])}<div class="dc L blank"></div><div class="dg"></div><div class="dc R blank"></div>${body}<div class="dfoot L"></div><div class="dg"></div><div class="dfoot R"></div></div>`;
}

/* ============ Compare ============ */
function refOptions(p, sel, withWorking) {
  const ids = Object.keys(p.versions).sort((a, b) => p.versions[b].time - p.versions[a].time);
  const vl = id => `${id.slice(0, 7)} · ${p.versions[id].message}`;

  return (withWorking ? opt("W", "Current text (includes unsaved changes)", true) : "") +
    `<optgroup label="Drafts">${Object.entries(p.drafts).filter(([, v]) => v).map(([n, v]) => opt(v, "draft: " + n, false)).join("")}</optgroup>` +
    (Object.keys(p.milestones).length ? `<optgroup label="Milestones">${Object.entries(p.milestones).map(([n, v]) => opt(v, "◆ " + n, false)).join("")}</optgroup>` : "") +
    `<optgroup label="Versions">${ids.map(id => opt(id, vl(id), true)).join("")}</optgroup>`;
}
function viewCompare(p, el) {
  const head = headId(p);

  const c = S.cmp;
  if (!c.b || (c.b !== "W" && !p.versions[c.b])) c.b = changedPaths(p).length ? "W" : head;
  if (!c.a || !p.versions[c.a]) c.a = c.b === "W" ? head : (p.versions[c.b].parent || head);

    <div class="Box" style="margin-bottom:16px"><div class="range">${ic("compare")}
      <label class="sr" for="c-a">Base</label><span class="muted">base:</span><select class="btn btn-sm" id="c-a">${refOptions(p, c.a, false)}</select>
      <span class="arrow">←</span>

/* ============ Drafts & milestones ============ */

      ${!isMain ? `<button class="btn-octicon" data-del="${esc(n)}" title="Delete draft" aria-label="Delete draft ${esc(n)}">${ic("trash")}</button>` : ""}</div>`;

function walkEntry(entry, prefix, out, isRoot) {
  return new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push({ file: f, path: prefix + f.name }); res(); }, () => res());
    else if (entry.isDirectory) {
      const reader = entry.createReader(), all = [];
      const next = () => reader.readEntries(async ents => {
        if (!ents.length) { for (const c of all) await walkEntry(c, isRoot ? prefix : prefix + entry.name + "/", out, false); res(); }
        else { all.push(...ents); next(); }
      }, () => res());
      next();
    } else res();
  });
}
const SKIP_NOTE = { pdf: "PDFs aren't versioned yet", png: "Images aren't versioned yet", jpg: "Images aren't versioned yet", jpeg: "Images aren't versioned yet", gif: "Images aren't versioned yet", svg: "Images aren't versioned yet", eps: "Images aren't versioned yet", doc: "Open in Word and Save As .docx first", xls: "Open in Excel and Save As .xlsx first", numbers: "Export from Numbers as .xlsx first", gsheet: "In Google Sheets choose File › Download › Microsoft Excel (.xlsx)", gdoc: "In Google Docs choose File › Download › Microsoft Word (.docx)", pages: "Export from Pages as .docx first", rtf: "Save as .docx first" };
async function importBytes(p, path, u8, log) {

      const base = path.includes("/") ? path.split("/").slice(0, -1).join("/") + "/" : "";
      for (const n of names) await importBytes(p, base + (strip ? n.split("/").slice(1).join("/") : n), await z.read(n), log);
      return;
    }
    if (ext === "docx") { const text = await docxToText(u8); return put(path, { text, orig: b64.from(u8) }, `${text.split("\n").length} paragraphs`); }
    if (ext === "xlsx") { const text = await xlsxToText(u8); return put(path, { text, orig: b64.from(u8) }, sheetSummary(text)); }
    if (ext === "ods") { const q = path.replace(/\.ods$/i, ".xlsx"); const text = await odsToText(u8); return put(q, { text, orig: null }, "OpenDocument spreadsheet converted to .xlsx (values and formulas) · " + sheetSummary(text), "converted"); }
    if (ext === "csv" || ext === "tsv") { const raw = dec.decode(u8).replace(/^\uFEFF/, ""); const rows = parseDelimited(raw, ext === "csv" ? "," : "\t"); const name = path.split("/").pop().replace(/\.[^.]+$/, ""); const text = sheetsToText([{ name, rows }]); return put(path, { text, orig: b64.from(u8) }, sheetSummary(text)); }
    if (ext === "odt") { const q = path.replace(/\.odt$/i, ".md"); return put(q, { text: await odtToMarkdown(u8), orig: null }, "OpenDocument converted to Markdown", "converted"); }
    if (ext === "html" || ext === "htm") { const q = path.replace(/\.html?$/i, ".md"); return put(q, { text: htmlToMarkdown(dec.decode(u8)), orig: null }, "Web page converted to Markdown", "converted"); }
    if (ext === "ris") { const q = path.replace(/\.ris$/i, ".bib"), items = risToFields(dec.decode(u8)), taken = new Set(); const text = items.map(it => entryToBib({ type: it.type, key: it.key && !taken.has(it.key) ? (taken.add(it.key), it.key) : (k => (taken.add(k), k))(makeKey(it.fields, taken)), fields: it.fields })).join("\n\n") + "\n"; return put(q, { text, orig: null }, `${items.length} reference${items.length === 1 ? "" : "s"} converted from RIS to BibTeX`, "converted"); }

  } catch (err) { log.push({ path, status: "skipped", note: err.message }); }
}
async function runImport(p, items) {
  if (!items.length) return;
  const dir = (S.importDir || "").trim().replace(/^\/+|\/+$/g, "");
  const log = []; toast("Importing…");
  for (const { file, path } of items) await importBytes(p, (dir ? dir + "/" : "") + path, new Uint8Array(await file.arrayBuffer()), log);
  const added = log.filter(x => x.status !== "skipped");
  if (added.length && S.importSave !== false && changedPaths(p).length) {
    const kinds = new Set(items.map(x => { const e = extOf(x.path); return e === "zip" ? "a .zip" : e === "docx" || e === "odt" ? "Word" : ["xlsx", "ods", "csv", "tsv"].includes(e) ? "spreadsheets" : e === "html" || e === "htm" ? "the web" : TEXT_EXT.slice(0, 7).includes(e) && e !== "md" && e !== "txt" ? "LaTeX" : "text files"; }));
    log.saved = await saveVersion(p, `Import ${added.length} file${added.length > 1 ? "s" : ""}${kinds.size === 1 ? " from " + [...kinds][0] : ""}`);
  }
  await persist(p, true);
  S.importLog = log; render();
  toast(added.length ? `Imported ${added.length} file${added.length > 1 ? "s" : ""}.` : "Nothing was imported. See the list for why.");
}

/* ============ Downloads ============ */
async function downloadAs(p, path, how) {
  const f = p.working[path]; const base = path.split("/").pop(), stem = base.replace(/\.[^.]+$/, "");
  if (how === "combined") { const t = assemble(p, path); return offerFile(base, t, t); }
  if (how === "docx") return offerFile(stem + ".docx", mdToDocx(secFmt(path) ? assemble(p, path) : f.text));
  if (how === "txt") return offerFile(stem + ".txt", f.text, f.text);
  if (how === "xlsx") return offerFile(stem + ".xlsx", xlsxFromText(f.text));
  if (how === "csvs") {
    const sheets = textToSheets(f.text);
    if (sheets.length === 1) return offerFile(stem + ".csv", toDelimited(sheets[0].rows, ","));
    return offerFile(stem + "-sheets.zip", zipStore(sheets.map(s => ({ name: slug(s.name) + ".csv", data: enc.encode(toDelimited(s.rows, ",")) }))));
  }
  if (DIRECT_EXT.includes(extOf(base))) return offerFile(base, await bytesOf(p, path, f), kindOf(path) === "text" ? f.text : null);
  return offerFile(base + ".zip", zipStore([{ name: base, data: await bytesOf(p, path, f) }]), kindOf(path) === "text" ? f.text : null);
}
async function downloadVersion(p, vid) {
  const tree = treeOf(p, vid), files = [];
  for (const [path, h] of Object.entries(tree)) files.push({ name: path, data: await bytesOf(p, path, p.blobs[h]) });
  if (!files.length) return toast("That version has no files.");
  await offerFile(`${slug(p.name)}-${vid.slice(0, 7)}.zip`, zipStore(files));
}

/* ============ GitHub backend ============
   Each Writer's Box project can be linked to a GitHub repository:
   versions = commits, drafts = branches, milestones = tags,
   reviews = pull requests, notes & to-dos = issues.
   The browser talks to api.github.com directly with the writer's own token (kept in this browser only). */
const GH = { token: null, user: null, base: "https://api.github.com", cache: {} };
const TOKEN_KEY = "wb.gh.token";
function ghLoadToken() { try { GH.token = localStorage.getItem(TOKEN_KEY) || null; } catch (e) { GH.token = null; } }
function ghSaveToken(t) { GH.token = t; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* storage blocked: token lasts for this visit */ } }
const ghSignedIn = () => !!(GH.token && GH.user);
const enc_ = s => encodeURIComponent(s);
const refPath = name => name.split("/").map(enc_).join("/");
function ghErrorText(status, data) {
  const m = data && data.message ? data.message : "";
  if (status === 401) return "GitHub didn't accept the token. Sign in again with a valid token.";
  if (status === 403 && /rate limit/i.test(m)) return "GitHub's rate limit was reached. Try again in a few minutes.";
  if (status === 403) return "This token doesn't have permission for that. " + (m ? "(" + m + ")" : "");
  if (status === 404) return "Not found on GitHub, or this token can't see it.";
  if (status === 409 && /empty/i.test(m)) return "That repository is empty.";
  if (status === 422) return "GitHub couldn't do that: " + (data && data.errors && data.errors[0] && (data.errors[0].message || data.errors[0].code) || m || "invalid request");
  return `GitHub error ${status}${m ? ": " + m : ""}`;
}
async function gh(path, opts = {}) {
  if (!GH.token) throw new Error("Sign in with GitHub first.");
  let res;
  try {
    res = await fetch(GH.base + path, {
      method: opts.method || "GET",
      headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + GH.token, "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch (e) {
    throw new Error(inClaudeViewer() ? "GitHub can't be reached from inside Claude. Open your hosted Writer's Box site (GitHub Pages) to use GitHub features." : "Couldn't reach GitHub. Check your connection and try again.");
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) { const err = new Error(ghErrorText(res.status, data)); err.status = res.status; err.data = data; throw err; }
  return data;
}
const inClaudeViewer = () => !!(window.claude && window.claude.use) || /claude\.ai|claudeusercontent/.test(location.hostname);
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));
  return out;
}
async function ghSignIn(token) {
  GH.token = token.trim();
  try { GH.user = await gh("/user"); ghSaveToken(GH.token); GH.cache = {}; return GH.user; }
  catch (e) { GH.token = null; GH.user = null; throw e; }
}
function ghSignOut() { ghSaveToken(null); GH.user = null; GH.cache = {}; }
async function ghCached(key, fetcher, maxAgeMs = 60000) {
  const c = GH.cache[key]; if (c && Date.now() - c.t < maxAgeMs) return c.data;
  const data = await fetcher(); GH.cache[key] = { t: Date.now(), data }; return data;
}
const ghBust = prefix => { for (const k of Object.keys(GH.cache)) if (k.startsWith(prefix)) delete GH.cache[k]; };

/* ---- mapping between Writer's Box drafts and Git branches ---- */
const isRemote = p => !!(p && p.remote);
const repoPath = p => `/repos/${enc_(p.remote.owner)}/${enc_(p.remote.repo)}`;
const remoteBranch = (p, local) => local === "main" ? (p.remote.def || "main") : local;
const localDraft = (p, remote) => remote === (p.remote.def || "main") ? "main" : remote;
const SUPPORTED_REMOTE = path => kindOf(path) !== "text" || TEXT_EXT.includes(extOf(path));
async function decodeRemote(path, u8) {
  const k = kindOf(path), ext = extOf(path);
  if (k === "docx") return { text: await docxToText(u8), orig: b64.from(u8) };
  if (ext === "xlsx") return { text: await xlsxToText(u8), orig: b64.from(u8) };
  if (ext === "csv" || ext === "tsv") { const name = path.split("/").pop().replace(/\.[^.]+$/, ""); return { text: sheetsToText([{ name, rows: parseDelimited(dec.decode(u8).replace(/^﻿/, ""), ext === "csv" ? "," : "\t") }]), orig: b64.from(u8) }; }
  return { text: dec.decode(u8).replace(/^﻿/, "").replace(/\r\n?/g, "\n"), orig: null };
}

/* ---- sync: pull branches, commits, trees and blobs into the local model ---- */
async function syncProject(p, progress = () => {}) {
  const R = repoPath(p);
  const info = await gh(R);
  Object.assign(p.remote, { def: info.default_branch, private: info.private, htmlUrl: info.html_url, ownerAvatar: info.owner && info.owner.avatar_url, permissions: info.permissions || {} });
  if (!p.description && info.description) p.description = info.description;
  progress("Reading drafts…");
  const branches = await gh(`${R}/branches?per_page=100`);
  branches.sort((a, b) => (a.name === info.default_branch ? -1 : b.name === info.default_branch ? 1 : a.name.localeCompare(b.name)));
  const meta = {}, firstBranch = {};
  for (const br of branches) {
    progress(`Reading history of ${localDraft(p, br.name)}…`);
    const list = await gh(`${R}/commits?sha=${enc_(br.name)}&per_page=60`);
    for (const c of list) { meta[c.sha] = c; if (!(c.sha in firstBranch)) firstBranch[c.sha] = br.name; }
  }
  const need = Object.values(meta).filter(c => !p.versions[c.sha] || !p.versions[c.sha].treeSha);
  progress(`Reading ${need.length} version${need.length === 1 ? "" : "s"}…`);
  const trees = {};
  await pool([...new Set(need.map(c => c.commit.tree.sha))], 6, async sha => {
    const t = await gh(`${R}/git/trees/${sha}?recursive=1`);
    trees[sha] = t.tree.filter(e => e.type === "blob" && SUPPORTED_REMOTE(e.path) && (e.size || 0) < 15e6);
  });
  const blobs = new Map();
  for (const sha of Object.keys(trees)) for (const e of trees[sha]) if (!p.blobs[e.sha] && !blobs.has(e.sha)) blobs.set(e.sha, e.path);
  let done = 0;
  await pool([...blobs.entries()], 6, async ([sha, path]) => {
    const b = await gh(`${R}/git/blobs/${sha}`);
    try { p.blobs[sha] = await decodeRemote(path, b64.to((b.content || "").replace(/\s/g, ""))); }
    catch (e) { p.blobs[sha] = { text: "(This file couldn't be read: " + e.message + ")", orig: null }; }
    if (++done % 5 === 0) progress(`Reading files ${done}/${blobs.size}…`);
  });
  for (const c of need) {
    const ps = c.parents.map(x => x.sha);
    p.versions[c.sha] = {
      parent: ps[0] && meta[ps[0]] ? ps[0] : (ps[0] && p.versions[ps[0]] ? ps[0] : null), parent2: ps[1] || undefined,
      tree: Object.fromEntries(trees[c.commit.tree.sha].map(e => [e.path, e.sha])), treeSha: c.commit.tree.sha,
      message: c.commit.message.split("\n")[0], body: c.commit.message.split("\n").slice(1).join("\n").trim(),
      time: Date.parse((c.commit.author || c.commit.committer).date), draft: localDraft(p, firstBranch[c.sha]),
      author: (c.commit.author && c.commit.author.name) || "", login: c.author && c.author.login, avatar: c.author && c.author.avatar_url
    };
  }

  if (!(p.current in p.drafts)) p.current = "main";
  const moved = p.remote.syncedHead && p.remote.syncedHead !== p.drafts[p.current];
  if (!changedPathsAgainst(p, p.remote.syncedHead).length || !p.remote.syncedHead) loadWorking(p, p.drafts[p.current]);
