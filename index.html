/* ---- remote writes ---- */
async function uploadBlob(p, path, f) {
  const bytes = await bytesOf(p, path, f);
  const b = await gh(`${repoPath(p)}/git/blobs`, { method: "POST", body: { content: b64.from(bytes), encoding: "base64" } });
  if (!p.blobs[b.sha]) p.blobs[b.sha] = { text: f.text, orig: kindOf(path) === "text" ? null : b64.from(bytes) };
  return b.sha;
}
async function saveVersionRemote(p, message) {
  const R = repoPath(p), head = headId(p), hv = head && p.versions[head];
  if (!hv) throw new Error("Sync this project before saving.");
  const entries = [], tree = {};
  for (const path of Object.keys(p.working).sort()) {
    const f = p.working[path], prev = hv.tree[path], pb = prev && p.blobs[prev];
    if (pb && pb.text === f.text && (pb.orig || null) === (f.orig || null)) { tree[path] = prev; continue; }
    tree[path] = await uploadBlob(p, path, f);
    entries.push({ path, mode: "100644", type: "blob", sha: tree[path] });
  }
  for (const path of Object.keys(hv.tree)) if (!p.working[path]) entries.push({ path, mode: "100644", type: "blob", sha: null });
  if (!entries.length) throw new Error("Nothing has changed since the last version.");

  const c = await gh(`${R}/git/commits`, { method: "POST", body: { message, tree: t.sha, parents: [head] } });

  p.drafts[p.current] = c.sha; p.remote.syncedHead = c.sha; ghBust("act:");
  return c.sha;
}
const createBranchRemote = (p, name, sha) => gh(`${repoPath(p)}/git/refs`, { method: "POST", body: { ref: "refs/heads/" + name, sha } });
const deleteBranchRemote = (p, name) => gh(`${repoPath(p)}/git/refs/heads/${refPath(name)}`, { method: "DELETE" });
const createTagRemote = (p, name, sha) => gh(`${repoPath(p)}/git/refs`, { method: "POST", body: { ref: "refs/tags/" + name, sha } });
const deleteTagRemote = (p, name) => gh(`${repoPath(p)}/git/refs/tags/${refPath(name)}`, { method: "DELETE" });
const fastForwardRemote = (p, draft, sha) => gh(`${repoPath(p)}/git/refs/heads/${refPath(remoteBranch(p, draft))}`, { method: "PATCH", body: { sha } });

/* ---- publish a local project as a new GitHub repository, history included ---- */
async function publishProject(p, { name, description, isPrivate }, progress = () => {}) {
  progress("Creating the repository…");
  const repo = await gh("/user/repos", { method: "POST", body: { name, description: description || "", private: !!isPrivate, auto_init: true, has_issues: true } });
  const R = `/repos/${enc_(repo.owner.login)}/${enc_(repo.name)}`;
  try { await gh(`${R}/topics`, { method: "PUT", body: { names: ["writers-box"] } }); } catch (e) { /* topic is a nicety */ }
  const init = (await gh(`${R}/commits?per_page=1`))[0];
  const initTree = init.commit.tree.sha, def = repo.default_branch;
  const tmp = { remote: { owner: repo.owner.login, repo: repo.name, def }, blobs: {} };
  const keyPath = new Map();
  for (const v of Object.values(p.versions)) for (const [path, k] of Object.entries(v.tree)) if (!keyPath.has(k)) keyPath.set(k, path);
  const shaOf = {}; let n = 0;
  progress(`Uploading ${keyPath.size} file version${keyPath.size === 1 ? "" : "s"}…`);
  await pool([...keyPath.entries()], 4, async ([k, path]) => {
    shaOf[k] = await uploadBlob(tmp, path, p.blobs[k]);
    if (++n % 5 === 0) progress(`Uploading files ${n}/${keyPath.size}…`);
  });
  const ids = Object.keys(p.versions).sort((a, b) => p.versions[a].time - p.versions[b].time);
  const map = {}, who = { name: GH.user.name || GH.user.login, email: `${GH.user.id}+${GH.user.login}@users.noreply.github.com` };
  let i = 0;
  for (const id of ids) {
    const v = p.versions[id];
    progress(`Writing version ${++i} of ${ids.length}: ${v.message}`);
    const t = await gh(`${R}/git/trees`, { method: "POST", body: { base_tree: initTree, tree: Object.entries(v.tree).map(([path, k]) => ({ path, mode: "100644", type: "blob", sha: shaOf[k] })) } });
    // Root versions start history themselves (GitHub's placeholder "Initial commit" is dropped; its README is kept via base_tree).
    const parents = v.parent && map[v.parent] ? [map[v.parent]] : []; if (v.parent2 && map[v.parent2]) parents.push(map[v.parent2]);
    const when = new Date(v.time).toISOString();
    const c = await gh(`${R}/git/commits`, { method: "POST", body: { message: v.message, tree: t.sha, parents, author: { ...who, date: when }, committer: { ...who, date: when } } });
    map[id] = c.sha;
  }
  progress("Linking drafts and milestones…");
  for (const [draft, head] of Object.entries(p.drafts)) {
    if (!head || !map[head]) continue;
    if (draft === "main") await gh(`${R}/git/refs/heads/${refPath(def)}`, { method: "PATCH", body: { sha: map[head], force: true } });
    else await gh(`${R}/git/refs`, { method: "POST", body: { ref: "refs/heads/" + draft, sha: map[head] } });
  }
  for (const [ms, vid] of Object.entries(p.milestones)) if (map[vid]) { try { await gh(`${R}/git/refs`, { method: "POST", body: { ref: "refs/tags/" + tagName(ms), sha: map[vid] } }); } catch (e) { /* duplicate name */ } }
  const working = p.working;
  p.remote = { owner: repo.owner.login, repo: repo.name, def, private: repo.private, htmlUrl: repo.html_url };
  p.versions = {}; p.blobs = {}; p.milestones = {};
  if (p.name !== repo.name && !p.name.includes("/")) p.name = p.name || repo.name;
  progress("Reading it back from GitHub…");
  await syncProject(p, progress);
  // Keep unsaved edits, on top of what GitHub now has (e.g. the README it created).
  p.working = { ...p.working, ...working };
  return repo;
}

/* ---- open (clone) a GitHub repository as a project ---- */
async function cloneRepo(owner, repo, progress = () => {}) {
  const p = newProject(repo);
  p.remote = { owner, repo };
  await syncProject(p, progress);
  loadWorking(p, p.drafts[p.current]);
  p.remote.syncedHead = p.drafts[p.current];
  return p;
}

/* ---- tiny Markdown renderer for review and note bodies ---- */
function mdLite(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)@([A-Za-z0-9-]+)/g, '$1<strong>@$2</strong>');
  const out = []; let list = null, quote = [];
  const flushQ = () => { if (quote.length) { out.push(`<blockquote>${quote.map(inline).join("<br>")}</blockquote>`); quote = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${i}</li>`).join("")}</${list.t}>`); list = null; } };
  for (const line of String(src || "").replace(/\r\n?/g, "\n").split("\n")) {
    let m;
    if ((m = /^>\s?(.*)$/.exec(line))) { flushL(); quote.push(m[1]); continue; }
    flushQ();
    if ((m = /^\s*[-*]\s+\[( |x)\]\s+(.*)$/i.exec(line))) { if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(`<input type="checkbox" disabled ${m[1].toLowerCase() === "x" ? "checked" : ""}> ${inline(m[2])}`); continue; }
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(inline(m[1])); continue; }
    if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) { if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(inline(m[1])); continue; }
    flushL();
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { out.push(`<h${Math.min(6, m[1].length + 2)}>${inline(m[2])}</h${Math.min(6, m[1].length + 2)}>`); continue; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  flushQ(); flushL();
  return out.join("") || `<p class="muted"><em>No description provided.</em></p>`;
}

const lastActivity = p => Math.max(p.created || 0, ...Object.values(p.versions).map(v => v.time));

  }
  const legend = [0, 1, 2, 3, 4].map((l, i) => `<rect x="${W - 5 * (cell + gap) - 30 + i * (cell + gap)}" y="${H - cell - 2}" width="${cell}" height="${cell}" rx="2" class="hm hm${l}"/>`).join("");

    ${rects}<text x="0" y="${H - 3}" class="hm-t">${total} version${total === 1 ? "" : "s"} saved</text><text x="${W - 5 * (cell + gap) - 58}" y="${H - 3}" class="hm-t">Less</text>${legend}<text x="${W - 26}" y="${H - 3}" class="hm-t">More</text></svg>`;
}

function pinCard(x) {
  const words = Object.values(x.working).reduce((n, f) => n + wordCount(f.text), 0);
  const types = {}; for (const path of Object.keys(x.working)) types[typeLabel(path)] = (types[typeLabel(path)] || 0) + wordCount(x.working[path].text);
  const top = Object.entries(types).sort((a, b) => b[1] - a[1])[0];
  return `<div class="Box pin"><div class="row">${ic("book")}<button class="link" data-open="${x.id}" style="font-weight:600">${esc(x.remote ? x.remote.repo : x.name)}</button><span class="label">${x.remote ? (x.remote.private ? "Private" : "Public") : "Local"}</span></div>
    <p class="muted">${esc(x.description || "")}</p>
    <div class="row muted" style="font-size:12px">${top ? `<span><span class="sw" style="background:${TYPE_COLOR[top[0]] || "#9198a1"}"></span> ${top[0]}</span>` : ""}<span>${ic("pilcrow")} ${words.toLocaleString()} words</span><span>${ic("history")} ${Object.keys(x.versions).length}</span></div></div>`;
}

/* ---------- Clone / publish / sync flows ---------- */
function progressModal(title) {
  const layer = $("#layer"), ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhead"><h3>${esc(title)}</h3></div><div class="mbody"><div class="row"><span class="spinner" aria-hidden="true"></span><span id="pg-text">Starting…</span></div></div></div>`;
  layer.appendChild(ov);
  return { set: t => { const x = $("#pg-text", ov); if (x) x.textContent = t; }, close: () => ov.remove() };
}
async function cloneFlow() {
  if (!ghSignedIn()) return signInFlow();
  const pm = progressModal("Open a project from GitHub"); pm.set("Loading your repositories…");
  let repos; try { repos = await ghCached("repos", () => gh("/user/repos?per_page=100&sort=updated")); } catch (e) { pm.close(); return toast(e.message); }
  pm.close();
  const linked = new Set(S.projects.filter(isRemote).map(x => (x.remote.owner + "/" + x.remote.repo).toLowerCase()));
  repos = [...repos].sort((a, b) => ((b.topics || []).includes("writers-box") - (a.topics || []).includes("writers-box")) || Date.parse(b.pushed_at) - Date.parse(a.pushed_at));
  modal({
    title: "Open a project from GitHub",
    body: `<input type="text" id="cl-q" placeholder="Filter repositories…" aria-label="Filter repositories"><div class="Box" style="max-height:50vh;overflow:auto" id="cl-list">${repos.map(r => `<div class="Box-row" data-name="${esc(r.full_name.toLowerCase())}">${ic("book")}<div class="grow" style="min-width:0"><strong>${esc(r.full_name)}</strong> ${r.private ? `<span class="label">Private</span>` : ""} ${(r.topics || []).includes("writers-box") ? `<span class="label label-done">Writer's Box</span>` : ""}<div class="muted" style="font-size:12px">${esc(r.description || "")}</div></div>${linked.has(r.full_name.toLowerCase()) ? `<span class="muted" style="font-size:12px">Open already</span>` : `<button class="btn btn-sm" data-clone="${esc(r.full_name)}">Open</button>`}</div>`).join("")}</div>
      <p class="muted" style="font-size:12px">LaTeX, Markdown, text, Word and spreadsheet files are read; other files stay on GitHub untouched.</p>`,
    onOpen: ov => {
      $("#cl-q", ov).oninput = e => { const q = e.target.value.toLowerCase(); ov.querySelectorAll("[data-name]").forEach(r => r.hidden = !r.dataset.name.includes(q)); };
      ov.querySelectorAll("[data-clone]").forEach(b => b.onclick = () => { ov.remove(); const [o, n] = b.dataset.clone.split("/"); doClone(o, n); });
    },
    actions: [{ label: "Close" }]
  });
}
async function doClone(owner, repo) {
  const pm = progressModal(`Opening ${owner}/${repo}`);
  try { const p = await cloneRepo(owner, repo, pm.set); S.projects.push(p); S.pid = p.id; await persist(p, true); pm.close(); resetSel(); go("files"); toast(`Opened ${owner}/${repo}.`); }
  catch (e) { pm.close(); toast(e.message); }
}
async function syncFlow(p, quiet) {
  if (!ghSignedIn()) return quiet ? null : signInFlow();
  const btn = $("#r-sync"); if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner sm"></span> Syncing`; }
  try { const r = await syncProject(p, () => {}); await persist(p, true); ghBust(`pr:${p.id}`); ghBust(`is:${p.id}`); render(); if (!quiet) toast(r.moved ? "Synced: new versions came in from GitHub." : "Up to date with GitHub."); }
  catch (e) { render(); toast(e.message); }
}
function publishFlow(p) {
  if (!ghSignedIn()) return signInFlow();
  modal({
    title: "Publish to GitHub",
    body: `<p>Writer's Box will create a repository in your GitHub account and copy every version, draft and milestone into it, so your full history comes along.</p>
      <label for="pb-name">Repository name<input type="text" id="pb-name" value="${esc(slug(p.name))}"></label>
      <label for="pb-desc">Description <span class="muted" style="font-weight:400">(optional)</span><input type="text" id="pb-desc" value="${esc(p.description || "")}"></label>
      <fieldset class="vis"><legend>Who can see it</legend>
        <label class="check"><input type="radio" name="vis" value="private" checked> <span><strong>Private</strong><br><span class="muted">Only you and collaborators you invite.</span></span></label>
        <label class="check"><input type="radio" name="vis" value="public"> <span><strong>Public</strong><br><span class="muted">Anyone on the internet can read it.</span></span></label></fieldset>
      <p class="muted" id="pb-msg"></p>`,
    actions: [{ label: "Cancel" }, { label: "Publish", primary: true, onClick: async ov => {
      const name = $("#pb-name", ov).value.trim().replace(/[^A-Za-z0-9._-]+/g, "-"), msg = $("#pb-msg", ov);
      if (!name) { msg.textContent = "Give the repository a name."; return false; }
      if (changedPaths(p).length && !Object.keys(p.versions).length) { msg.textContent = "Save a first version, then publish."; return false; }
      const isPrivate = ov.querySelector('input[name="vis"]:checked').value === "private";
      ov.remove();
      const pm = progressModal("Publishing to GitHub");
      try { const repo = await publishProject(p, { name, description: $("#pb-desc", ov).value.trim(), isPrivate }, pm.set); await persist(p, true); pm.close(); ghBust("repos"); render(); toast(`Published to ${repo.full_name}.`); }
      catch (e) { pm.close(); toast(e.message); }
      return true;
    } }]
  });
}

/* ---------- Reviews (pull requests) ---------- */
function viewReviews(p, el) {
  if (!isRemote(p) || !ghSignedIn()) return needsGitHub(el, p, "reviews");
  const state = S.revState || "open";
  loadingInto(el);
  listPulls(p, state === "open" ? "open" : "closed").then(prs => {
    const ready = Object.keys(p.drafts).filter(d => d !== "main" && aheadBehind(p, d).ahead > 0);
    el.innerHTML = `
      ${ready.length && state === "open" ? `<div class="flash info">${ic("info")}<span>${ready.map(d => `<span class="branch-name">${esc(d)}</span>`).join(" ")} ${ready.length > 1 ? "have" : "has"} changes ready for review.</span><span class="grow"></span><button class="btn btn-sm btn-primary" data-newrev="${esc(ready[0])}">Request review</button></div>` : ""}
      <div class="row" style="margin-bottom:16px"><span class="grow"></span><button class="btn btn-primary" id="rv-new">${ic("merge")} Request a review</button></div>
      <div class="Box"><div class="Box-header"><div class="row"><button class="link ${state === "open" ? "" : "link-muted"}" data-st="open" style="font-weight:${state === "open" ? 600 : 400};color:var(--fg)">${ic("merge")} Open</button><button class="link ${state === "closed" ? "" : "link-muted"}" data-st="closed" style="font-weight:${state === "closed" ? 600 : 400};color:var(--fg)">${ic("check")} Closed</button></div></div>
      ${prs.map(r => `<div class="Box-row">${r.merged_at ? ic("merge", "merged-ic") : r.state === "open" ? ic("merge", "open-ic") : ic("x", "closed-ic")}<div class="grow" style="min-width:0"><button class="link" data-pr="${r.number}" style="font-weight:600;color:var(--fg);font-size:15px">${esc(r.title)}</button>
        <div class="muted" style="font-size:12px">#${r.number} · ${esc(r.user.login)} asked to merge <span class="branch-name">${esc(localDraft(p, r.head.ref))}</span> into <span class="branch-name">${esc(localDraft(p, r.base.ref))}</span> · ${r.merged_at ? "merged " + ago(Date.parse(r.merged_at)) : r.state === "open" ? "opened " + ago(Date.parse(r.created_at)) : "closed " + ago(Date.parse(r.closed_at))}</div></div>
        ${(r.requested_reviewers || []).slice(0, 3).map(u => avatarImg(ghImgOk() ? u.avatar_url : null, u.login, 20)).join("")}</div>`).join("") || `<div class="blankslate">${ic("merge")}<h3>${state === "open" ? "No open reviews" : "No closed reviews yet"}</h3><p class="muted">A review asks someone to read a draft's changes, comment on them and approve merging them into main.</p></div>`}</div>`;
    el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { S.revState = b.dataset.st; viewReviews(p, el); });
    el.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => go("review", { num: +b.dataset.pr }));
    $("#rv-new").onclick = () => requestReviewFlow(p, ready[0]);
    el.querySelectorAll("[data-newrev]").forEach(b => b.onclick = () => requestReviewFlow(p, b.dataset.newrev));
  }).catch(e => errorInto(el, e, () => viewReviews(p, el)));
}
async function requestReviewFlow(p, draft) {
  if (!isRemote(p) || !ghSignedIn()) return toast("Publish this project to GitHub first.");
  const drafts = Object.keys(p.drafts).filter(d => d !== "main");
  if (!drafts.length) return toast("Create a draft first: reviews compare a draft with main.");
  if (changedPaths(p).length) return toast("Save your unsaved changes as a version first.");
  let collabs = []; try { collabs = (await ghCached(`co:${p.id}`, () => gh(`${repoPath(p)}/collaborators?per_page=100`))).filter(u => u.login !== GH.user.login); } catch (e) { /* not an admin */ }
  const d0 = draft || drafts[0], v0 = p.drafts[d0] && p.versions[p.drafts[d0]];
  modal({
    title: "Request a review",
    body: `<label for="rq-d">Draft to review<select class="form" id="rq-d">${drafts.map(d => `<option value="${esc(d)}" ${d === d0 ? "selected" : ""}>${esc(d)} (${aheadBehind(p, d).ahead} new version${aheadBehind(p, d).ahead === 1 ? "" : "s"})</option>`).join("")}</select></label>
      <label for="rq-t">Title<input type="text" id="rq-t" value="${esc(v0 ? v0.message : "")}"></label>
      <label for="rq-b">What should the reviewer look at?<textarea class="form" id="rq-b" rows="5" placeholder="e.g. I cut the executive summary to two sentences. Does it still make the case?"></textarea></label>
      ${collabs.length ? `<div><span style="font-weight:600">Reviewers</span><div class="Box" style="margin-top:6px">${collabs.map(u => `<label class="Box-row check" style="font-weight:400"><input type="checkbox" value="${esc(u.login)}" class="rq-u"> ${avatarImg(ghImgOk() ? u.avatar_url : null, u.login, 20)} ${esc(u.login)}</label>`).join("")}</div></div>` : `<p class="muted" style="font-size:12px">To ask a specific person, invite them as a collaborator in Settings first. You can still open the review and share its link.</p>`}
      <p class="muted" id="rq-msg"></p>`,
    onOpen: ov => { const t = $("#rq-t", ov); let edited = false; t.addEventListener("input", () => edited = true);
      $("#rq-d", ov).onchange = e => { const v = p.drafts[e.target.value] && p.versions[p.drafts[e.target.value]]; if (!edited && v) t.value = v.message; }; },
    actions: [{ label: "Cancel" }, { label: "Request review", primary: true, onClick: async ov => {
      const d = $("#rq-d", ov).value, title = $("#rq-t", ov).value.trim(), msg = $("#rq-msg", ov);
      if (!title) { msg.textContent = "Give the review a title."; return false; }
      if (!aheadBehind(p, d).ahead) { msg.textContent = "That draft has nothing main doesn't already have."; return false; }
      msg.textContent = "Opening the review on GitHub…";
      try {
        const pr = await gh(`${repoPath(p)}/pulls`, { method: "POST", body: { title, body: $("#rq-b", ov).value, head: remoteBranch(p, d), base: remoteBranch(p, "main") } });
        const who = [...ov.querySelectorAll(".rq-u:checked")].map(x => x.value);
        if (who.length) { try { await gh(`${repoPath(p)}/pulls/${pr.number}/requested_reviewers`, { method: "POST", body: { reviewers: who } }); } catch (e) { toast(e.message); } }
        ghBust(`pr:${p.id}`); go("review", { num: pr.number }); toast(`Review #${pr.number} opened.`); return true;
      } catch (e) { msg.textContent = e.message; return false; }
    } }]
  });
}
function viewReview(p, el) {
  if (!isRemote(p) || !ghSignedIn()) return needsGitHub(el, p, "reviews");
  const n = S.num, R = repoPath(p), tab = S.revTab || "conversation";
  loadingInto(el);
  Promise.all([gh(`${R}/pulls/${n}`), gh(`${R}/issues/${n}/comments?per_page=100`), gh(`${R}/pulls/${n}/reviews?per_page=100`)]).then(async ([pr, comments, reviews]) => {
    const head = localDraft(p, pr.head.ref), base = localDraft(p, pr.base.ref);
    if (pr.head.sha && !p.versions[pr.head.sha] || pr.base.sha && !p.versions[pr.base.sha]) { try { await syncProject(p); await persist(p, true); } catch (e) { /* show what we have */ } }
    const timeline = [...comments.map(c => ({ t: Date.parse(c.created_at), kind: "comment", user: c.user, body: c.body })),
      ...reviews.filter(r => r.state !== "PENDING").map(r => ({ t: Date.parse(r.submitted_at), kind: "review", user: r.user, body: r.body, state: r.state }))].sort((a, b) => a.t - b.t);
    const approvals = reviews.filter(r => r.state === "APPROVED").length, changesReq = reviews.filter(r => r.state === "CHANGES_REQUESTED").length;
    const stateLbl = pr.merged_at ? `<span class="state merged">${ic("merge")} Merged</span>` : pr.state === "open" ? `<span class="state open">${ic("merge")} Open</span>` : `<span class="state closed">${ic("x")} Closed</span>`;
    const mine = pr.user.login === GH.user.login;
    const evIcon = { APPROVED: ["check", "Approved these changes", "ok"], CHANGES_REQUESTED: ["alert", "Asked for changes", "bad"], COMMENTED: ["pencil", "Reviewed", ""], DISMISSED: ["x", "Review dismissed", ""] };
    el.innerHTML = `
      <div class="pr-head"><h1>${esc(pr.title)} <span class="muted" style="font-weight:300">#${pr.number}</span></h1>
        <div class="row">${stateLbl}<span class="muted"><strong style="color:var(--fg)">${esc(pr.user.login)}</strong> ${pr.merged_at ? "merged" : "wants to merge"} <span class="branch-name">${esc(head)}</span> into <span class="branch-name">${esc(base)}</span></span><span class="grow"></span><a class="btn btn-sm" href="${esc(pr.html_url)}" target="_blank" rel="noopener">View on GitHub</a></div></div>
      <nav class="unav sub" aria-label="Review"><button data-rt="conversation" ${tab === "conversation" ? 'aria-current="page"' : ""}><span class="in">${ic("pencil")} Conversation <span class="counter">${timeline.length}</span></span></button><button data-rt="changes" ${tab === "changes" ? 'aria-current="page"' : ""}><span class="in">${ic("compare")} Changes</span></button></nav>
      <div id="rv-body" style="margin-top:16px"></div>`;
    el.querySelectorAll("[data-rt]").forEach(b => b.onclick = () => { S.revTab = b.dataset.rt; viewReview(p, el); });
    const body = $("#rv-body");
    if (tab === "changes") {
      const a = p.drafts[base] && p.versions[pr.base.sha] ? pr.base.sha : p.drafts[base], b = p.versions[pr.head.sha] ? pr.head.sha : p.drafts[head];
      if (!a || !b) { body.innerHTML = `<div class="Box-body muted">Sync this project to load the changes.</div>`; return; }
      body.innerHTML = `<p class="muted" style="margin:0 0 12px">Click <strong>+</strong> beside a changed paragraph to comment on it.</p><div id="rv-diffs"></div>`;
      renderDiffs(p, a, b, $("#rv-diffs"), { onComment: (path, label, text) => commentOnLine(p, pr, path, label, text) });
      return;
    }
    body.innerHTML = `<div class="tl">
        <div class="tl-c">${avatarImg(ghImgOk() ? pr.user.avatar_url : null, pr.user.login, 32)}<div class="Box cmt"><div class="Box-header"><strong>${esc(pr.user.login)}</strong><span class="muted">asked for a review ${ago(Date.parse(pr.created_at))}</span></div><div class="Box-body md">${mdLite(pr.body)}</div></div></div>
        ${timeline.map(x => x.kind === "review" && !x.body ? `<div class="tl-ev ${evIcon[x.state] ? evIcon[x.state][2] : ""}">${ic(evIcon[x.state] ? evIcon[x.state][0] : "pencil")}<strong>${esc(x.user.login)}</strong> <span class="muted">${evIcon[x.state] ? evIcon[x.state][1].toLowerCase() : "reviewed"} ${ago(x.t)}</span></div>`
          : `<div class="tl-c">${avatarImg(ghImgOk() ? x.user.avatar_url : null, x.user.login, 32)}<div class="Box cmt ${x.state === "APPROVED" ? "ok" : x.state === "CHANGES_REQUESTED" ? "bad" : ""}"><div class="Box-header"><strong>${esc(x.user.login)}</strong><span class="muted">${x.kind === "review" && evIcon[x.state] ? evIcon[x.state][1].toLowerCase() : "commented"} ${ago(x.t)}</span></div><div class="Box-body md">${mdLite(x.body)}</div></div></div>`).join("")}
      </div>
      ${pr.state === "open" ? `<div class="merge-box Box ${approvals && !changesReq ? "ok" : ""}"><div class="Box-body">
          <div class="row">${approvals && !changesReq ? ic("check") : changesReq ? ic("alert") : ic("info")}<strong>${approvals && !changesReq ? `Approved by ${approvals} reviewer${approvals > 1 ? "s" : ""}` : changesReq ? "Changes were requested" : "Waiting for review"}</strong></div>
          <p class="muted" style="margin:6px 0 12px">${pr.mergeable === false ? "These changes conflict with main. Merge main into the draft on GitHub, or bring the draft up to date, then try again." : "Merging adds this draft's versions to main. The draft stays available until you delete it."}</p>
          <div class="row"><button class="btn btn-primary" id="rv-merge" ${pr.mergeable === false ? "disabled" : ""}>${ic("merge")} Merge into ${esc(base)}</button><button class="btn" id="rv-close">Close without merging</button></div></div></div>` : ""}
      <div class="tl-c" style="margin-top:16px">${avatarImg(ghImgOk() ? GH.user.avatar_url : null, GH.user.login, 32)}<div class="Box cmt grow"><div class="Box-header"><strong>Add your review</strong></div><div class="Box-body"><label class="sr" for="rv-txt">Comment</label><textarea class="form" id="rv-txt" rows="4" placeholder="Leave a comment. Markdown works: **bold**, *italic*, > quotes, - lists."></textarea>
        <div class="row" style="margin-top:8px;justify-content:flex-end">${pr.state === "open" && !mine ? `<button class="btn" data-ev="REQUEST_CHANGES">${ic("alert")} Ask for changes</button><button class="btn" data-ev="APPROVE">${ic("check")} Approve</button>` : ""}<button class="btn btn-primary" data-ev="COMMENT">Comment</button></div>
        ${mine && pr.state === "open" ? `<p class="muted" style="font-size:12px;margin:8px 0 0">GitHub doesn't let you approve your own review request; your reviewers can.</p>` : ""}</div></div></div>`;
    el.querySelectorAll("[data-ev]").forEach(b => b.onclick = async () => {
      const txt = $("#rv-txt").value.trim(), ev = b.dataset.ev;
      if (ev !== "APPROVE" && !txt) return toast(ev === "COMMENT" ? "Write a comment first." : "Say what should change.");
      b.disabled = true;
      try {
        if (ev === "COMMENT") await gh(`${R}/issues/${n}/comments`, { method: "POST", body: { body: txt } });
        else await gh(`${R}/pulls/${n}/reviews`, { method: "POST", body: { event: ev, body: txt } });
        toast(ev === "APPROVE" ? "Approved." : ev === "REQUEST_CHANGES" ? "Asked for changes." : "Comment posted."); viewReview(p, el);

      <div class="tile"><div class="tile-n">${points.length >= 2 ? ((last.words - first.words >= 0 ? "+" : "−") + Math.abs(last.words - first.words).toLocaleString()) : "—"}</div><div class="muted">since the first version</div></div>
      <div class="tile"><div class="tile-n">${chain.length}</div><div class="muted">versions on this draft</div></div>

    <div class="Box"><div class="Box-header"><strong>Activity</strong><span class="muted">versions saved per day, this project</span></div><div class="Box-body" style="overflow-x:auto">${heatmapSvg(versionsByDay([p]), false)}</div></div>
    <div class="ins-two">

      <div class="Box"><div class="Box-header"><strong>Contributors</strong></div>${Object.entries(authors).sort((a, b) => b[1].n - a[1].n).map(([k, a]) => `<div class="Box-row">${avatarImg(ghImgOk() ? a.avatar : null, k, 24)}<strong class="grow">${esc(k)}</strong><span class="muted">${a.n} version${a.n === 1 ? "" : "s"}</span></div>`).join("")}</div></div></div>`;
  el.querySelectorAll("[data-file]").forEach(b => b.onclick = () => go("file", { file: b.dataset.file }));
  bindChartHover($("#ins-chart"), points);

function wordsChart(points) {
  const W = 880, H = 240, L = 56, R = 16, T = 16, B = 32;
  const t0 = points[0].v.time, t1 = points.at(-1).v.time, span = Math.max(1, t1 - t0);

  const area = `${line}L${X(t1).toFixed(1)},${Y(0)}L${X(t0).toFixed(1)},${Y(0)}Z`;

    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="tick">${v.toLocaleString()}</text>`).join("")}
    ${dates.map((t, i) => `<text x="${X(t)}" y="${H - 10}" text-anchor="${["start", "middle", "end"][i]}" class="tick">${new Date(t).toLocaleDateString([], { month: "short", day: "numeric" })}</text>`).join("")}
    <path d="${area}" class="area"/><path d="${line}" class="line"/>
    ${points.map((q, i) => `<circle cx="${X(q.v.time).toFixed(1)}" cy="${Y(q.words).toFixed(1)}" r="${i === points.length - 1 ? 5 : 3.5}" class="pt ${i === points.length - 1 ? "end" : ""}"/>`).join("")}
    <text x="${X(t1) - 8}" y="${Y(points.at(-1).words) - 10}" text-anchor="end" class="endlbl">${points.at(-1).words.toLocaleString()} words</text>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
}
const niceCeil = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };

  box.style.position = "relative";

    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * (880 / r.width);
    let best = 0, bd = 1e9; circles.forEach((c, i) => { const d = Math.abs(+c.getAttribute("cx") - sx); if (d < bd) { bd = d; best = i; } });

  hit.addEventListener("click", () => { const on = circles.findIndex(k => k.classList.contains("on")); if (on >= 0) go("version", { vid: points[on].id }); });
}

/* ---------- Line history (blame) ---------- */
function blame(p, path, head) {
  const chain = firstParentChain(p, head);
  const headText = refText(p, "W", path) || textAt(p, head, path);
  const lines = headText.split("\n"), attr = new Array(lines.length).fill(null);
  let map = lines.map((_, i) => i), curText = headText, curId = "W";
  for (const id of chain) {
    const pText = textAt(p, id, path);
    const ops = myers(pText === "" ? [] : pText.split("\n"), curText === "" ? [] : curText.split("\n"));
    const toParent = new Map(); let ia = 0, ib = 0;
    for (const [t] of ops) { if (t === "=") { toParent.set(ib, ia); ia++; ib++; } else if (t === "-") ia++; else ib++; }
    map = map.map((ci, li) => { if (ci == null) return null; if (toParent.has(ci)) return toParent.get(ci); if (attr[li] == null) attr[li] = curId; return null; });
    curText = pText; curId = id;
    if (map.every(x => x == null)) break;
  }
  map.forEach((ci, li) => { if (ci != null && attr[li] == null) attr[li] = curId; });
  return lines.map((l, i) => ({ line: l, vid: attr[i] }));
}

  const rows = blame(p, path, headId(p)), docx = kindOf(path) === "docx", sheet = kindOf(path) === "sheet";
  const times = rows.map(r => r.vid && r.vid !== "W" ? p.versions[r.vid].time : Date.now());
  const tMin = Math.min(...times), tMax = Math.max(...times), age = t => tMax === tMin ? 4 : Math.round(1 + 4 * (t - tMin) / (tMax - tMin));
  let html = "", prev = null;
  rows.forEach((r, i) => {
    const v = r.vid && r.vid !== "W" ? p.versions[r.vid] : null, start = r.vid !== prev; prev = r.vid;
    html += `<tr class="${start ? "bstart" : ""}"><td class="bmeta">${start ? (v ? `<button class="link" data-v="${r.vid}" title="${esc(v.message)}">${esc(v.message)}</button><span class="muted"> · ${ago(v.time)}</span>` : `<span class="muted"><em>Unsaved change</em></span>`) : ""}</td><td class="bage a${age(times[i])}"></td><td class="n">${docx ? "¶" : ""}${i + 1}</td><td class="t">${(sheet && r.line.startsWith(SHEET_HDR) ? "<strong>" + esc(r.line) + "</strong>" : esc(r.line).replace(/\t/g, sheet ? '<span class="csep"></span>' : "\t")) || " "}</td></tr>`;
  });
  mount.innerHTML = `<div style="overflow-x:auto"><table class="code-view blame"><tbody>${html}</tbody></table></div>`;
  mount.querySelectorAll("[data-v]").forEach(b => b.onclick = () => go("version", { vid: b.dataset.v }));
}

/* ============ AI through OpenRouter ============
   Optional. Used to read style guides (web pages, PDFs) and to describe another paper's structure.
   The writer connects their own OpenRouter account (one click, OAuth PKCE) or pastes a key.
   The key is stored only in this browser. Text is sent to OpenRouter and the chosen model only when the writer asks. */
const OR_KEY = "wb.or.key", OR_MODEL = "wb.or.model", OR_VERIFIER = "wb.or.verifier";
const OR_DEFAULT_MODEL = "openrouter/auto";

async function llmConnect() {
  if (!orCanConnect()) throw new Error(inClaudeViewer() ? "Connecting OpenRouter works on your hosted Writer's Box site, not inside Claude's preview." : "Connecting OpenRouter needs the site to be served over https.");
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(verifier))));
  sessionStorage.setItem(OR_VERIFIER, verifier);
  location.href = `https://openrouter.ai/auth?callback_url=${encodeURIComponent(orCallback())}&code_challenge=${challenge}&code_challenge_method=S256`;
}
/* Called at start-up: finishes the connection when OpenRouter sends the writer back with ?code= */
async function llmFinishConnect() {
  const u = new URL(location.href), code = u.searchParams.get("code"), verifier = sessionStorage.getItem(OR_VERIFIER);
  if (!code || !verifier) return false;
  sessionStorage.removeItem(OR_VERIFIER); u.searchParams.delete("code");
  try { history.replaceState(history.state, "", u.pathname + (u.search || "") + u.hash); } catch (e) { /* ignore */ }
  try {
    const r = await fetch("https://openrouter.ai/api/v1/auth/keys", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, code_verifier: verifier, code_challenge_method: "S256" }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.key) throw new Error((j.error && j.error.message) || "OpenRouter didn't return a key.");
    llmSetKey(j.key); toast("OpenRouter connected."); return true;
  } catch (e) { toast("Couldn't connect OpenRouter: " + e.message); return false; }
}

/* One chat completion. parts: array of strings or {file, name, mime} (PDFs are sent as files). Returns the reply text. */
async function llmChat({ system, parts, json = false, fetchUrls = false, maxTokens = 4000 }) {
  if (!llmConnected()) throw new Error("Connect OpenRouter in Settings › Connections to use AI features.");
  if (liveBlocked()) throw new Error("AI features work on your hosted Writer's Box site, not inside Claude's preview.");
  const content = [];
  for (const x of parts) {
    if (typeof x === "string") content.push({ type: "text", text: x });
    else content.push({ type: "file", file: { filename: x.name || "document.pdf", file_data: `data:${x.mime || "application/pdf"};base64,${b64.from(x.file)}` } });
  }
  const body = { model: llmModel(), max_tokens: maxTokens, messages: [...(system ? [{ role: "system", content: system }] : []), { role: "user", content }] };
  if (json) body.response_format = { type: "json_object" };
  if (fetchUrls) body.tools = [{ type: "openrouter:web_fetch", parameters: { max_uses: 4 } }];
  const call = async b => {
    let r;
    try { r = await fetch("https://openrouter.ai/api/v1/chat/completions", { method: "POST", headers: { Authorization: "Bearer " + llmKey(), "Content-Type": "application/json", "HTTP-Referer": location.origin, "X-Title": "Writer's Box" }, body: JSON.stringify(b) }); }
    catch (e) { throw new Error("Couldn't reach OpenRouter. Check your connection."); }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { throw Object.assign(new Error("OpenRouter didn't accept the key. Reconnect in Settings › Connections."), { status: 401 }); }
    if (r.status === 402) throw new Error("Your OpenRouter account is out of credits.");
    if (!r.ok) throw Object.assign(new Error((j.error && j.error.message) || `OpenRouter error ${r.status}.`), { status: r.status });
    const msg = j.choices && j.choices[0] && j.choices[0].message;
    const text = msg && (typeof msg.content === "string" ? msg.content : Array.isArray(msg.content) ? msg.content.map(c => c.text || "").join("") : "");
    if (!text) throw new Error("The model returned an empty answer. Try again or pick another model.");
    return text;
  };
  try { return await call(body); }
  catch (e) { if (json && e.status === 400) { delete body.response_format; return call(body); } throw e; }
}
function parseJsonLoose(text) {
  const t = text.replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch (e) { /* fall through */ }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fall through */ } }
  throw new Error("The model's answer wasn't in the expected format. Try again, or pick a different model in Settings › Connections.");
}
async function llmJSON(opts) { return parseJsonLoose(await llmChat({ ...opts, json: true })); }

/* ============ References (citation manager) ============
   A project's references live in its BibTeX file(s), so they are versioned, compared, reviewed and synced
   like any other file. Edits replace only the edited entry's text, so other entries keep their formatting. */

/* ---------- BibTeX parsing ---------- */
const MONTHS = { jan: "January", feb: "February", mar: "March", apr: "April", may: "May", jun: "June", jul: "July", aug: "August", sep: "September", oct: "October", nov: "November", dec: "December" };
function parseBib(text) {

  while ((i = text.indexOf("@", i)) !== -1) {
    const m = /^@\s*([A-Za-z]+)\s*([{(])/.exec(text.slice(i, i + 64));
    if (!m) { i++; continue; }

    const body = text.slice(i + m[0].length, k - 1);
    if (type === "comment" || type === "preamble") { i = k; continue; }
    if (type === "string") { Object.assign(strings, Object.fromEntries(Object.entries(parseBibFields(body, strings).fields).map(([a, b]) => [a.toLowerCase(), b]))); i = k; continue; }
    const comma = body.indexOf(","), key = (comma < 0 ? body : body.slice(0, comma)).trim();
    const { fields, order } = parseBibFields(comma < 0 ? "" : body.slice(comma + 1), strings);
    entries.push({ type, key, fields, order, start: i, end: k });
    i = k;
  }
  return entries;
}
function parseBibFields(s, strings) {

}

/* ---------- Split / add / combine ---------- */
function sectionsFlow(p, path) {
  const fmt = secFmt(path), incs = secIncludes(p, path), hs = secHeadings(p.working[path].text, fmt);
  const ranks = [...new Set(hs.map(h => h.rank))].sort((a, b) => a - b);
  if (incs.length) {
    return modal({ title: "Sections", body: `<p>${esc(path)} is made of ${incs.length} section file${incs.length > 1 ? "s" : ""}.</p>
      <div class="Box"><div class="Box-row"><div class="grow"><strong>Download the whole document</strong><div class="muted" style="font-size:12px">One ${fmt === "tex" ? ".tex" : ".md"} file with every section pulled in</div></div><button class="btn btn-sm" data-act="dl">Download</button></div>
      ${fmt === "md" ? `<div class="Box-row"><div class="grow"><strong>Download as Word</strong><div class="muted" style="font-size:12px">The whole document as one .docx</div></div><button class="btn btn-sm" data-act="docx">Download</button></div>` : ""}
      ${hs.length ? `<div class="Box-row"><div class="grow"><strong>Split the rest</strong><div class="muted" style="font-size:12px">${hs.length} heading${hs.length > 1 ? "s are" : " is"} still in ${esc(path)} itself</div></div><button class="btn btn-sm" data-act="split">Split</button></div>` : ""}
      <div class="Box-row"><div class="grow"><strong>Combine into one file</strong><div class="muted" style="font-size:12px">Put every section back into ${esc(path)} and remove the section files</div></div><button class="btn btn-sm btn-danger" data-act="combine">Combine</button></div></div>`,
      onOpen: ov => ov.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
        const act = b.dataset.act; ov.querySelector("[data-x]").click();
        if (act === "dl") { const t = assemble(p, path); return offerFile(path.split("/").pop(), t, t); }
        if (act === "docx") return offerFile(stemOf(path) + ".docx", mdToDocx(assemble(p, path)));
        if (act === "split") return splitFlow(p, path);
        if (!await confirmBox("Combine sections?", `Every section will be put back into ${esc(path)}, and the ${incs.filter(s => s.exists).length} section files will be removed from the project. Past versions keep them.`, "Combine", true)) return;
        const text = assemble(p, path); for (const s of incs) if (s.exists && secParents(p, s.path).length <= 1) delete p.working[s.path];
        p.working[path].text = text; persist(p, true); go("file", { file: path }, true); toast("Sections combined. Save a version to keep the change.");
      }),
      actions: [{ label: "Close" }] });
  }
  if (!ranks.length) return modal({ title: "Split into sections", body: `<p>There are no headings in ${esc(path)} to split at${fmt === "tex" ? " (\\chapter, \\section or \\subsection)" : " (lines starting with #)"}.</p><p class="muted">Start a section instead: each section you add becomes its own file, and ${esc(path)} keeps them in order.</p>`,
    actions: [{ label: "Cancel" }, { label: "Add a section", primary: true, onClick: () => { setTimeout(() => addSectionFlow(p, path)); return true; } }] });
  return splitFlow(p, path);
}
function splitFlow(p, path) {
  const fmt = secFmt(path), hs = secHeadings(p.working[path].text, fmt), ranks = [...new Set(hs.map(h => h.rank))].sort((a, b) => a - b);
  let rank = ranks.find(r => hs.filter(h => h.rank <= r).length >= 2) ?? ranks[0];
  let folder = dirOf(path) ? stemOf(path) : (p.working["sections"] ? stemOf(path) : stemOf(path) === "main" ? "sections" : stemOf(path));
  modal({
    title: "Split into sections",
    body: `<p class="muted" style="margin-top:0">Each section becomes its own file you can open, write, review and share on its own. ${esc(path)} keeps them in order${fmt === "tex" ? " with <span class='mono'>\\input</span>, so it still compiles as before" : ""}.</p>
      <div class="rf-grid"><label for="sp-rank">Split at<select class="form" id="sp-rank">${ranks.map(r => `<option value="${r}" ${r === rank ? "selected" : ""}>${rankName(fmt, r)} (${hs.filter(h => h.rank <= r).length} sections)</option>`).join("")}</select></label>
      <label for="sp-dir">Folder for the sections<input type="text" id="sp-dir" value="${esc(folder)}" style="font-family:var(--mono)"></label></div>
      <span class="side-h">Files to create</span><div class="Box sec-plan" id="sp-plan"></div>`,
    onOpen: ov => {
      const show = () => { rank = +$("#sp-rank", ov).value; folder = $("#sp-dir", ov).value.trim(); const plan = planSplit(p, path, rank, folder);
        $("#sp-plan", ov).innerHTML = (plan.head.length ? `<div class="Box-row muted" style="font-size:12px">${fileIcon(path)} <span class="mono">${esc(path)}</span> keeps ${fmt === "tex" ? "the preamble and title" : "the text before the first heading"} and lists the sections</div>` : "")
          + plan.chunks.map((c, i) => `<div class="Box-row"><span class="sec-n">${i + 1}</span><div class="grow" style="min-width:0"><strong>${esc(c.title)}</strong><div class="muted mono sec-path">${esc(c.path)}</div></div><span class="muted" style="font-size:12px">${wordCount(c.text).toLocaleString()} words</span></div>`).join(""); };
      ov.addEventListener("input", show); ov.addEventListener("change", show); show();
    },
    actions: [{ label: "Cancel" }, { label: "Split into sections", primary: true, onClick: ov => {
      const plan = planSplit(p, path, +$("#sp-rank", ov).value, $("#sp-dir", ov).value.trim());
      applySplit(p, path, plan); S.secOpen = true; persist(p, true); go("file", { file: path }, true);

    } }]

}
function addSectionFlow(p, path) {
  const fmt = secFmt(path), incs = secIncludes(p, path).filter(s => s.exists);
  const sib = incs[0] ? secHeadings(p.working[incs[0].path].text, fmt)[0] : null;
  const rank = sib ? sib.rank : fmt === "tex" ? (/\\chapter\b/.test(p.working[path].text) || /documentclass(\[[^\]]*\])?\{(book|report)/.test(p.working[path].text) ? 1 : 2) : 2;
  const dir = incs[0] ? dirOf(incs[0].path) : normPath(dirOf(path) + (dirOf(path) ? stemOf(path) : stemOf(path) === "main" ? "sections" : stemOf(path))) + "/";
  modal({
    title: "Add a section",
    body: `<label for="as-title">Section title<input type="text" id="as-title" placeholder="e.g. Background"></label>
      <label for="as-pos">Position<select class="form" id="as-pos">${incs.map((s, i) => `<option value="${i}">Before ${esc(secTitle(p, s.path))}</option>`).join("")}<option value="end" selected>At the end</option></select></label>
      <p class="muted" style="font-size:12px">Creates <span class="mono" id="as-path">${esc(dir)}…</span></p>`,
    onOpen: ov => { const i = $("#as-title", ov); i.oninput = () => $("#as-path", ov).textContent = dir + (slug(i.value) || "…") + (fmt === "tex" ? ".tex" : "." + extOf(path)); i.onkeydown = e => { if (e.key === "Enter") $(".mactions .btn-primary", ov).click(); }; },
    actions: [{ label: "Cancel" }, { label: "Add section", primary: true, onClick: ov => {
      const title = $("#as-title", ov).value.trim(); if (!title) return false;
      const file = freePath(p, dir + (slug(title) || "section") + (fmt === "tex" ? ".tex" : "." + extOf(path)), new Set());
      const heading = fmt === "tex" ? `\\${Object.keys(TEX_RANK).find(k => TEX_RANK[k] === rank)}{${title}}` : `${"#".repeat(rank)} ${title}`;
      p.working[file] = { text: heading + "\n\n", orig: null };
      const pos = $("#as-pos", ov).value, lines = p.working[path].text.split("\n");
      const at = pos === "end" ? secInsertAt(p, path) : secIncludes(p, path).filter(s => s.exists)[+pos].line;
      const add = [incLine(path, file, fmt)]; if (!incs.length && at > 0 && lines[at - 1].trim()) add.unshift(""); if (!incs.length && lines[at] && lines[at].trim()) add.push("");
      lines.splice(at, 0, ...add); p.working[path].text = lines.join("\n"); persist(p, true);
      S.secOpen = true; go("file", { file, fileMode: "write" }); toast(`Added “${title}”. It's listed in ${path}.`); return true;
    } }]

}

function deleteCustomStyle(p, id) { try { localStorage.setItem(STYLE_LIB, JSON.stringify(customStyles().filter(x => x.id !== id))); } catch (e) { /* ignore */ } if (p && p.styles) { delete p.styles[id]; persist(p, true); } }

  if (!base) return JSON.parse(JSON.stringify(s));
  const out = JSON.parse(JSON.stringify(base)); for (const [k, v] of Object.entries(s)) out[k] = JSON.parse(JSON.stringify(v)); delete out.extends; return out;
}

/* ---------- reading a document into blocks ----------
   Inline text keeps *italic* and **bold**; citations become \u0001C{json}\u0002 and footnotes \u0001F text \u0002. */
const CITE = o => "\u0001C" + JSON.stringify(o) + "\u0002", FOOT = t => "\u0001F" + t.replace(/[\u0001\u0002]/g, "") + "\u0002";
function mdInlineCites(s) {
  return s.replace(/\[([^\[\]]*@[\w:.\-]+[^\[\]]*)\]/g, (m, inner) => {
    const items = inner.split(";").map(x => { const mm = /^\s*(.*?)-?@([\w:.\-]+)\s*,?\s*(.*?)\s*$/.exec(x); return mm ? { pre: mm[1].trim(), key: mm[2], loc: mm[3].trim() } : null; }).filter(Boolean);

}

    if (/^\s*(```|~~~)/.test(l)) { flush(); fence = !fence; continue; }
    if (fence) { blocks.push({ t: "code", text: raw }); continue; }
    if (!l.trim()) { flush(); continue; }

      <div data-pane="file" hidden><div class="dropzone" id="is-drop">${ic("import")}<strong>Drop a guide or a style file</strong><span class="muted">.pdf · .docx · .md · .txt · .html · Writer's Box .style.json</span><label class="btn btn-sm" for="is-file">Choose file</label><input type="file" id="is-file" accept=".pdf,.docx,.md,.txt,.html,.htm,.json" hidden></div><p class="muted" id="is-fname"></p></div>
      <div data-pane="paste" hidden><label for="is-text">Paste the formatting requirements<textarea class="form" id="is-text" rows="8" placeholder="Papers must be double-spaced in 12-point Times New Roman with 1-inch margins…"></textarea></label></div>
      <div class="se-grid"><label for="is-base">Start from<select class="form" id="is-base">${allStyles(p).map(s => `<option value="${esc(s.id)}" ${s.id === fmtState(p).style ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
        <label class="check" style="align-self:end"><input type="checkbox" id="is-ai" ${llmConnected() ? "checked" : "disabled"}> <span>Read it with AI${llmConnected() ? "" : " (connect OpenRouter in Settings)"}</span></label></div>
      <p class="muted" id="is-msg"></p>`,
    onOpen: ov => {
      ov.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; ov.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x === b)); ov.querySelectorAll("[data-pane]").forEach(x => x.hidden = x.dataset.pane !== mode); });
      const fi = $("#is-file", ov); fi.onchange = () => $("#is-fname", ov).textContent = fi.files[0] ? fi.files[0].name : "";
      const drop = $("#is-drop", ov); drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); }); drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const dt = new DataTransfer(); dt.items.add(e.dataTransfer.files[0]); fi.files = dt.files; fi.onchange(); });
    },
    actions: [{ label: "Cancel" }, { label: "Read style", primary: true, onClick: async ov => {
      const msg = $("#is-msg", ov), base = resolveStyle(p, $("#is-base", ov).value), ai = $("#is-ai", ov).checked;
      const src = mode === "link" ? { kind: "link", url: $("#is-url", ov).value.trim() } : mode === "file" ? { kind: "file", file: $("#is-file", ov).files[0] } : { kind: "paste", text: $("#is-text", ov).value };
      if ((mode === "link" && !/^https?:\/\//.test(src.url)) || (mode === "file" && !src.file) || (mode === "paste" && src.text.trim().length < 20)) { msg.textContent = mode === "link" ? "Enter a link starting with https://." : mode === "file" ? "Choose a file." : "Paste the requirements first."; return false; }
      msg.innerHTML = `<span class="spinner sm"></span> Reading…`;
      try {
        const head = mode === "file" && src.file.size < 2e6 ? (await src.file.slice(0, 200).text()).trim() : "";
        if (mode === "file" && (/\.json$/i.test(src.file.name) || (head.startsWith("{") && head.includes("writers-box-style")))) { const j = JSON.parse(await src.file.text()); if (j.format !== "writers-box-style" || !j.style) throw new Error("That isn't a Writer's Box style file."); const st = mergeSpec(base, j.style); st.id = "custom-" + uid(); delete st.builtin; ov.querySelector("[data-x]").click(); styleEditFlow(p, st, false, "Imported from a style file. Check it, then save."); return false; }
        const got = await readSource(src);
        let spec, note;
        if (ai && llmConnected()) {
          const parts = [`Formatting guidelines for a written paper follow${got.url ? ` at this link: ${got.url}` : ""}. Convert them to JSON matching this schema:\n${SPEC_SCHEMA}\nStart from this base style and change only what the guidelines say: ${JSON.stringify({ page: base.page, header: base.header, titlePage: base.titlePage, headingBlock: base.headingBlock, references: base.references, citations: base.citations })}\nReturn only the JSON object. Write "rules" as short checklist items in your own words (do not copy passages). Give the style a short "name".`];
          if (got.text) parts.push(got.text.slice(0, 60000)); if (got.pdf) parts.push({ file: got.pdf, name: got.name || "guide.pdf" });
          msg.innerHTML = `<span class="spinner sm"></span> Asking ${esc(llmModel())} to read it…`;
          const j = await llmJSON({ system: "You turn writing and formatting guidelines into a precise JSON style specification. Only use what the guidelines state.", parts, fetchUrls: !!got.url });
          spec = mergeSpec(base, j); note = `Read with AI from ${esc(src.url || (src.file && src.file.name) || "pasted text")}. Check every setting against the guide before using it.`;
        } else {
          if (got.blocked) throw new Error("This site doesn't allow other sites to read it. Connect OpenRouter in Settings › Connections, or copy the requirements and use Paste.");
          if (got.pdf) throw new Error("Reading PDFs needs the OpenRouter connection. Or copy the text from the PDF and use Paste.");
          spec = styleFromText(got.text, base); note = `Settings were picked out of the text automatically, starting from ${esc(base.name)}, and the sentences about formatting became the checklist. Check them against the guide.`;
        }
        spec.id = "custom-" + uid(); delete spec.builtin; delete spec.extends; spec.name = spec.name && spec.name !== base.name ? spec.name : "Imported style";
        spec.source = { label: src.url ? new URL(src.url).hostname : src.file ? src.file.name : "Pasted guidelines", url: src.url || "" };
        ov.querySelector("[data-x]").click(); styleEditFlow(p, spec, false, note); return false;
      } catch (e) { msg.textContent = e.message; return false; }
    } }]
  });
}

/* ---------- copy another paper's structure ---------- */
function structureFlow(p) {
  let mode = "file";
  modal({
    title: "Copy a paper's structure",
    body: `<p class="muted" style="margin-top:0">Use a model paper (a published article, an example from your instructor, last year's report) as a template: Writer's Box picks out its sections and formatting and starts a new outline for you. None of its text is copied.</p>
      <div class="seg" role="group" aria-label="Source"><button aria-pressed="true" data-m="file">Document</button><button aria-pressed="false" data-m="link">Link</button><button aria-pressed="false" data-m="paste">Paste</button><button aria-pressed="false" data-m="project">From this project</button></div>
      <div data-pane="file"><div class="dropzone">${ic("import")}<strong>Choose the model paper</strong><span class="muted">.docx · .pdf · .tex · .md · .txt</span><label class="btn btn-sm" for="cs-file">Choose file</label><input type="file" id="cs-file" accept=".docx,.pdf,.tex,.md,.markdown,.txt,.html" hidden></div><p class="muted" id="cs-fname"></p></div>
      <div data-pane="link" hidden><label for="cs-url">Link to the paper<input type="url" id="cs-url" placeholder="https://…"></label></div>
      <div data-pane="paste" hidden><label for="cs-text">Paste the paper, or just its headings<textarea class="form" id="cs-text" rows="8"></textarea></label></div>
      <div data-pane="project" hidden><label for="cs-doc">Document<select class="form" id="cs-doc">${formattable(p).map(d => `<option>${esc(d)}</option>`).join("")}</select></label></div>
      <label class="check"><input type="checkbox" id="cs-ai" ${llmConnected() ? "checked" : "disabled"}> <span>Describe each section's purpose with AI${llmConnected() ? "" : " (connect OpenRouter in Settings)"}</span></label>
      <p class="muted" style="font-size:12px">Without AI, Writer's Box reads the headings, section lengths and (for Word files) the page set-up. PDFs and links need AI.</p>
      <p class="muted" id="cs-msg"></p>`,
    onOpen: ov => {
      ov.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; ov.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x === b)); ov.querySelectorAll("[data-pane]").forEach(x => x.hidden = x.dataset.pane !== mode); });
      const fi = $("#cs-file", ov); fi.onchange = () => $("#cs-fname", ov).textContent = fi.files[0] ? fi.files[0].name : "";
    },
    actions: [{ label: "Cancel" }, { label: "Read structure", primary: true, onClick: async ov => {
      const msg = $("#cs-msg", ov), ai = $("#cs-ai", ov).checked && llmConnected();
      try {
        let got, label;
        if (mode === "project") { const d = $("#cs-doc", ov).value; if (!d) throw new Error("No document to read."); const r = await docBlocks(p, d); got = { blocks: r.blocks, meta: r.meta, info: r.info }; label = d; }
        else if (mode === "file") { const f = $("#cs-file", ov).files[0]; if (!f) throw new Error("Choose a file."); got = await readSource({ kind: "file", file: f }); label = f.name; if (got.docx) { got.blocks = got.docx.blocks; got.info = got.docx.info; got.meta = got.docx.meta; } else if (got.tex) { const r = texBlocks(got.text); got.blocks = r.blocks; got.meta = r.meta; } else if (got.text) { const r = mdBlocks(got.text); got.blocks = r.blocks; got.meta = r.meta; } }
        else if (mode === "link") { const u = $("#cs-url", ov).value.trim(); if (!/^https?:\/\//.test(u)) throw new Error("Enter a link starting with https://."); msg.innerHTML = `<span class="spinner sm"></span> Reading…`; got = await readSource({ kind: "link", url: u }); label = new URL(u).hostname; if (got.text) { const r = mdBlocks(got.text); got.blocks = r.blocks; got.meta = r.meta; } }
        else { const t = $("#cs-text", ov).value; if (t.trim().length < 10) throw new Error("Paste the paper or its headings."); got = { text: t }; const r = mdBlocks(t.split("\n").map(l => /^#/.test(l) || l.length > 80 || !l.trim() ? l : /^[A-Z0-9IVX]+[.)]\s|^[A-Z][^.!?]{2,60}$/.test(l.trim()) ? "## " + l.replace(/^[A-Z0-9IVX]+[.)]\s*/, "") : l).join("\n")); got.blocks = r.blocks; got.meta = r.meta; label = "pasted text"; }
        let outline = got.blocks ? outlineFromBlocks(got.blocks) : [], formatting = got.info || null, cite = null, summary = "";
        if (ai) {
          msg.innerHTML = `<span class="spinner sm"></span> Asking ${esc(llmModel())} to describe the structure…`;
          const parts = [`Describe the structure of this paper so a writer can use it as a template for a different paper on their own topic. Do not reproduce its text or arguments.
Return JSON: {"summary": one sentence on the kind of paper, "sections": [{"heading": generic heading (keep standard headings like Introduction, Methods; replace topic-specific headings with a generic description in brackets), "level": 1-3, "purpose": what this section does in one sentence, "share": percent of total length}], "citation": "apa"|"mla"|"chicago"|"bluebook"|"other", "formatting": partial style using this schema (only what you can see): ${SPEC_SCHEMA}}${got.url ? `\nThe paper is at ${got.url}.` : ""}`];
          if (got.text) parts.push(got.text.slice(0, 80000)); else if (got.blocks) parts.push(got.blocks.map(b => (b.t === "h" ? "#".repeat(b.level) + " " + b.text : `[paragraph, ${wordCount(b.text)} words]`)).join("\n"));
          if (got.pdf) parts.push({ file: got.pdf, name: got.name || "paper.pdf" });
          const j = await llmJSON({ system: "You analyse the structure of academic and professional papers. You never copy their wording.", parts, fetchUrls: !!got.url });
          if (Array.isArray(j.sections) && j.sections.length) outline = j.sections.map(s => ({ heading: String(s.heading || "Section"), level: Math.max(1, Math.min(3, +s.level || 1)), purpose: String(s.purpose || ""), share: +s.share || 0 }));
          formatting = j.formatting || formatting; cite = j.citation; summary = j.summary || "";
        } else {
          if (got.blocked) throw new Error("That site can't be read from the browser. Connect OpenRouter, download the paper and choose it as a document, or paste its headings.");
          if (got.pdf) throw new Error("Reading PDFs needs the OpenRouter connection. You can also paste the paper's headings.");
        }
        if (!outline.length) throw new Error("No sections found. Paste the paper's headings, one per line, or use AI.");
        ov.querySelector("[data-x]").click(); outlineResultFlow(p, { outline, formatting, cite, summary, label, title: (got.meta && got.meta.title) || "" }); return false;
      } catch (e) { msg.textContent = e.message; return false; }
    } }]
  });
}
function outlineFromBlocks(blocks) {
  const total = Math.max(1, blocks.filter(b => b.t !== "h").reduce((n, b) => n + wordCount(b.text || ""), 0)), out = []; let cur = null;
  for (const b of blocks) { if (b.t === "h") { cur = { heading: b.text.replace(/\*/g, "").replace(/\u0001.*?\u0002/g, ""), level: Math.min(3, b.level), purpose: "", words: 0 }; out.push(cur); } else if (cur) cur.words += wordCount(b.text || ""); else if (b.t === "abstract") out.push({ heading: "Abstract", level: 1, purpose: "", words: wordCount(b.text) }); }
  return out.map(s => ({ ...s, share: Math.round(s.words / total * 100) }));
}
function outlineResultFlow(p, r) {
  const fmtNames = { md: "Markdown (.md)", tex: "LaTeX (.tex)" };
  modal({
    title: "Structure found",
    body: `<p class="muted" style="margin-top:0">From ${esc(r.label)}${r.summary ? ": " + esc(r.summary) : ""}. Edit the outline, then start your paper from it.</p>
      <label for="or-out">Outline <span class="muted" style="font-weight:400">(one heading per line; indent with # for levels; text after “ — ” is a note to yourself)</span><textarea class="form" id="or-out" rows="10" style="font-family:var(--mono);font-size:12px">${esc(r.outline.map(s => "#".repeat(s.level) + " " + s.heading + (s.purpose || s.share ? " — " + [s.purpose, s.share ? `about ${s.share}% of the paper` : ""].filter(Boolean).join(" · ") : "")).join("\n"))}</textarea></label>
      <div class="se-grid"><label for="or-name">New document<input type="text" id="or-name" value="${esc(slug(r.title || "outline") || "outline")}" style="font-family:var(--mono)"></label>
        <label for="or-fmt">As<select class="form" id="or-fmt">${Object.entries(fmtNames).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        <label for="or-words">Target length (words)<input type="number" id="or-words" value="3000" step="250" min="0"></label></div>
      <label class="check"><input type="checkbox" id="or-split" checked> <span>Make each top-level section its own file</span></label>
      ${r.formatting ? `<label class="check"><input type="checkbox" id="or-style" checked> <span>Save the paper's formatting as a style${r.formatting.font || (r.formatting.page && r.formatting.page.font) ? ` (${esc((r.formatting.page && r.formatting.page.font) || r.formatting.font)})` : ""}</span></label>` : ""}`,
    actions: [{ label: "Cancel" }, { label: "Create outline", primary: true, onClick: ov => {
      const g = id => $("#" + id, ov), ext = g("or-fmt").value, words = +g("or-words").value || 0;
      let name = g("or-name").value.trim().replace(/\.(md|tex)$/i, "") || "outline"; const taken = new Set(); const path = freePath(p, name + "." + ext, taken);
      const lines = g("or-out").value.split("\n").map(l => /^(#{1,6})\s+(.*?)(?:\s+—\s+(.*))?$/.exec(l.trim())).filter(Boolean);
      if (!lines.length) { toast("Add at least one heading."); return false; }
      const cmd = ["section", "subsection", "subsubsection"];
      const body = lines.map(([, h, head, note]) => { const lvl = h.length, sh = /(\d+)%/.exec(note || ""), target = sh && words ? ` Aim for about ${Math.round(words * +sh[1] / 100 / 50) * 50} words.` : "";
        return ext === "tex" ? `\\${cmd[Math.min(2, lvl - 1)]}{${head}}\n${note || target ? `% ${(note || "").replace(/about \d+% of the paper/, "").replace(/\s·\s*$/, "").trim()}${target}\n` : ""}` : `${"#".repeat(lvl + 1)} ${head}\n\n${note || target ? `<!-- ${(note || "").replace(/about \d+% of the paper/, "").replace(/\s·\s*$/, "").trim()}${target} -->\n` : ""}`; }).join("\n");
      const title = "[Your title]";
      p.working[path] = { text: ext === "tex" ? `\\documentclass[12pt]{article}\n\\title{${title}}\n\\author{}\n\\begin{document}\n\\maketitle\n\n${body}\n\\end{document}\n` : `---\ntitle: "${title}"\n---\n\n${body}`, orig: null };
      if (g("or-split").checked) { const plan = planSplit(p, path, ext === "tex" ? 2 : 2, stemOf(path)); if (plan && plan.chunks.length > 1) applySplit(p, path, plan); }
      const st = g("or-style"); if (st && st.checked && r.formatting) { const flat = r.formatting.page || r.formatting.header ? r.formatting : { page: { margin: r.formatting.margin, font: r.formatting.font, size: r.formatting.size, spacing: r.formatting.spacing, indent: r.formatting.indent } }; const base = resolveStyle(p, r.cite === "mla" ? "mla9" : r.cite === "chicago" ? "chicago18-nb" : r.cite === "bluebook" ? "bluebook-memo" : "apa7-student"); const spec = mergeSpec(base, flat); spec.id = "custom-" + uid(); delete spec.builtin; delete spec.extends; spec.name = `Like ${r.label}`.slice(0, 60); spec.source = { label: r.label, url: "" }; spec.rules = [...(spec.rules || [])]; saveCustomStyle(p, spec); fmtState(p).style = spec.id; }
      fmtState(p).doc = path; persist(p, true); go("file", { file: path, fileMode: "write" }); toast(`Started ${path} from the outline. Save a version when you're ready.`); return true;
    } }]
  });
}

/* ============ Boot ============ */
const ROUTES = ["home", "profile", "files", "history", "drafts", "reviews", "notes", "refs", "format", "live", "insights", "compare", "import", "settings"];
let autoSynced = new Set();
function autoSync() { const p = P(); if (p && isRemote(p) && ghSignedIn() && !autoSynced.has(p.id)) { autoSynced.add(p.id); syncFlow(p, true); } }
(async function boot() {
  ghLoadToken();
  const orBack = llmFinishConnect();
  await dbOpen();
  let list = [];
  try { list = (await dbAll()) || []; } catch (e) { list = []; }
  S.projects = list.sort((a, b) => a.created - b.created);
  if (!S.projects.length) { const { p } = await seedProject(); S.projects.push(p); persist(p, true); }
  S.pid = S.projects[0].id; resetSel();
  const h = location.hash.slice(1);
  S.route = ROUTES.includes(h) ? h : "home";
  // Start history at Home, so Back from any screen you land on stays in Writer's Box.
  try { const want = S.route; S.route = "home"; history.replaceState(navState(), "", "#home"); S.route = want; if (want !== "home") history.pushState(navState(), "", navHash()); } catch (e) { /* ignore */ }
  window.addEventListener("popstate", onNavPop);
  render();
  if (await orBack) { go("settings"); }
  if (GH.token) {
    try { GH.user = await gh("/user"); render(); autoSync(); }
    catch (e) { if (e.status === 401) { ghSignOut(); toast("Your GitHub sign-in expired. Sign in again to sync."); } render(); }
  }
  window.addEventListener("hashchange", () => { if (history.state && history.state.route) return; const v = location.hash.slice(1); if (ROUTES.includes(v)) go(v, {}, true); });
})();
</script>
